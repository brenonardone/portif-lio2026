  .note{position:absolute;font:600 15px var(--mono);color:var(--dim);letter-spacing:.06em;}
  .row{display:flex;align-items:center;gap:18px;}

  .card .num{font-size:58px;}
  .card p{margin-top:14px;font:400 21px/1.4 var(--sans);color:var(--ink2);}
  .card p b{color:var(--strong);}
  .tag{display:inline-flex;align-items:center;gap:10px;font:700 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:7px 14px;border-radius:999px;border:1px solid currentColor;}

  #ctl button:hover{border-color:var(--acc);box-shadow:0 0 12px rgba(var(--accRgb),.5);}
  body.capture #ctl{display:none;}
</style>

scene('atencao','Pontos de atenção',8,`
  <div class="kick" data-in="0" style="color:var(--hl)"><em>09</em>Pontos de atenção</div>
  <div class="title" data-in=".15">Onde <b>agir</b> primeiro</div>
  ${ATT.map((a,i)=>`<div class="glass card" style="left:${120+(i%2)*850}px;top:${320+Math.floor(i/2)*290}px;width:810px;height:250px;border-color:${a[0]}" data-in="${(.5+i*.35).toFixed(2)}" data-fx="${i%2?'left':'right'}">
    <h3 style="color:${a[0]}">⚠ ${a[1]}</h3><div class="num">${a[2]}</div><p>${a[3]}</p></div>`).join('')}`);

scene('fechamento','Fechamento',8,`
  <div class="kick" data-in="0" style="color:var(--ok)"><em>10</em>Fechamento</div>
  <div class="title" data-in=".15">${cap(MES)} em <b>três números</b></div>
  ${[[K.pct_faturados,'pc1','pedidos faturados','var(--ok)'],[K.inventario_acuracia,'pc1','acurácia do inventário','var(--acc)'],[K.prazo_entrega_mediana,'int','dias de prazo de entrega B2B (mediana)','var(--b2c)']].map((x,i)=>`
  <div style="position:absolute;left:${120+i*580}px;top:330px;width:540px" data-in="${(.5+i*.3).toFixed(1)}" data-fx="up">
    <div style="height:4px;width:120px;background:${x[3]};box-shadow:0 0 14px ${x[3]};border-radius:2px"></div>
    <div class="big" style="font-size:150px;margin-top:26px" data-count="${x[0]}" data-fmt="${x[1]}" data-in="${(.6+i*.3).toFixed(1)}">0</div>
    <div class="lbl" style="margin-top:16px;font-size:17px">${x[2]}</div></div>`).join('')}
  <div class="glass card" style="left:120px;top:700px;width:1680px;height:190px" data-in="2" data-fx="up">
    <h3 style="color:var(--ok)">Foco para o próximo mês</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:50px;margin-top:6px;font:400 24px/1.35 var(--sans);color:var(--ink2)">
      <div data-in="2.3">▸ Reduzir os <b style="color:var(--strong)">${pc(K.pct_incompletos)}</b> de pedidos incompletos</div>
      <div data-in="2.6">▸ Atacar a falha logística na devolução (<b style="color:var(--strong)">${pc(K.pct_ofensor_logistica)}</b>)</div>
      <div data-in="2.9">▸ Liberar espaço em <b style="color:var(--strong)">${corHot.map(c=>c[0]).join(', ')}</b></div></div></div>
  <div data-in="4" data-fx="fade" style="position:absolute;left:0;right:0;top:940px;text-align:center" class="lbl">Orbital Twin · dados auditados · gerado ${M.gerado}</div>`);

/* ---------- montagem ---------- */
let acc=0;S.forEach(s=>{s.t0=acc;acc+=s.dur;});const TOTAL=acc;
const root=document.getElementById('scenes');
S.forEach((s,i)=>{const el=document.createElement('section');el.className='scene';el.innerHTML=s.html;root.appendChild(el);s.el=el;
  s.items=[...el.querySelectorAll('[data-in]')].map(e=>({e,in:+e.dataset.in,fx:e.dataset.fx||'up',len:+(e.dataset.len||.9),base:e.style.transform||''}));
  s.counts=[...el.querySelectorAll('[data-count]')].map(e=>({e,v:+e.dataset.count,f:FMT[e.dataset.fmt]||FMT.int,in:+(e.dataset.in||0)}));
  s.grows=[...el.querySelectorAll('[data-grow]')].map(e=>({e,in:+e.dataset.grow}));
  s.bars=[...el.querySelectorAll('[data-bar]')].map(e=>({e,in:+e.dataset.in}));
  s.draws=[...el.querySelectorAll('[data-draw]')].map(e=>({e,in:+e.dataset.in,len:+(e.dataset.len||1.5),L:e.getTotalLength()}));
  s.rings=[...el.querySelectorAll('[data-ring]')].map(e=>({e,v:+e.dataset.ring,in:+e.dataset.in,L:2*Math.PI*+e.getAttribute('r')}));
  s.spins=[...el.querySelectorAll('[data-spin]')].map(e=>({e,sp:+e.dataset.spin}));
  s.travel=[...el.querySelectorAll('[data-travel]')].map(e=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',e.dataset.travel);el.querySelector('svg').appendChild(p);p.style.display='none';return {e,p,L:0};});
  s.sweep=el.querySelector('[data-sweep]');
});
S.forEach(s=>s.travel.forEach(t=>{t.p.style.display='';t.L=t.p.getTotalLength();t.p.style.display='none';}));
const prog=document.getElementById('prog');prog.innerHTML=S.map(()=>'<i><b></b></i>').join('');const segs=[...prog.children].map(x=>x.firstChild);
document.getElementById('hudGen').textContent='gerado '+M.gerado;

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const FX={up:(p)=>`translateY(${(1-p)*40}px)`,down:(p)=>`translateY(${-(1-p)*40}px)`,left:(p)=>`translateX(${(1-p)*80}px)`,right:(p)=>`translateX(${-(1-p)*80}px)`,
  scale:(p)=>`scale(${.85+.15*p})`,pop:(p)=>`scale(${back(p)})`,blur:(p)=>`scale(${1.08-.08*p})`,fade:()=>''};

/* ---------- fundo: piso holográfico em perspectiva + partículas (função do tempo) ---------- */
const bg=document.getElementById('bg'),cx=bg.getContext('2d');
const PTS=Array.from({length:140},(_,i)=>{const r=Math.sin(i*12.9898)*43758.5453;const f=r-Math.floor(r);const r2=Math.sin(i*78.233)*12345.678;const g=r2-Math.floor(r2);return {x:f*1920,y:g*1080,z:.2+((f*7)%1)*.8};});
function drawBg(t){cx.clearRect(0,0,1920,1080);
  const hz=640,vx=960;cx.lineWidth=1;
  for(let i=-24;i<=24;i++){const x=vx+i*160;cx.strokeStyle=`rgba(${C.accRgb},${.10-.0025*Math.abs(i)})`;cx.beginPath();cx.moveTo(vx+i*10,hz);cx.lineTo(x,1080);cx.stroke();}
  const sp=(t*.35)%1;for(let k=0;k<14;k++){const z=(k+sp)/14,y=hz+Math.pow(z,2.4)*(1080-hz);cx.strokeStyle=`rgba(${C.accRgb},${(.02+.12*z).toFixed(3)})`;cx.beginPath();cx.moveTo(0,y);cx.lineTo(1920,y);cx.stroke();}
  const g=cx.createLinearGradient(0,hz-120,0,hz+40);g.addColorStop(0,`rgba(${C.accRgb},0)`);g.addColorStop(1,`rgba(${C.accRgb},.08)`);cx.fillStyle=g;cx.fillRect(0,hz-120,1920,160);
  PTS.forEach(p=>{const y=(p.y-t*14*p.z)%1080,yy=y<0?y+1080:y,a=.15+.45*p.z*(.6+.4*Math.sin(t*2+p.x));cx.fillStyle=p.z>.9?`rgba(${C.p2},${a*C.pA})`:`rgba(${C.p1},${a*C.pA})`;cx.fillRect(p.x,yy,1.2+p.z*1.6,1.2+p.z*1.6);});
}

/* ---------- render(t): estado completo de tudo a partir do tempo (permite gravar quadro a quadro) ---------- */
let T=0;
function render(t){T=clamp(t,0,TOTAL);drawBg(T);
  S.forEach((s,i)=>{const l=T-s.t0, on=l>-.01&&l<s.dur+.7&&(i===S.length-1||l<s.dur+.7);
    const fin=clamp(l/.6), fout=i===S.length-1?1:1-clamp((l-s.dur)/.7), vis=on&&fin*fout>0;
    s.el.style.visibility=vis?'visible':'hidden';if(!vis)return;
    s.el.style.opacity=(eo(fin)*fout).toFixed(3);s.el.style.transform=`scale(${(1+.05*(1-fout)).toFixed(4)})`;s.el.style.filter=fout<1?`blur(${((1-fout)*6).toFixed(1)}px)`:'';
    s.items.forEach(o=>{const p=eo(clamp((l-o.in)/o.len));o.e.style.opacity=p.toFixed(3);const tr=FX[o.fx]?FX[o.fx](o.fx==='pop'?clamp((l-o.in)/o.len):p):'';o.e.style.transform=(o.base+' '+tr).trim();if(o.fx==='blur')o.e.style.filter=`blur(${((1-p)*14).toFixed(1)}px)`;});
    s.counts.forEach(o=>{const p=eio(clamp((l-o.in)/1.6));o.e.textContent=o.f(o.v*p);});
    s.grows.forEach(o=>{o.e.style.transform=`scaleX(${eo(clamp((l-o.in)/1.1)).toFixed(4)})`;});
    s.bars.forEach(o=>{o.e.style.transform=`scaleY(${eo(clamp((l-o.in)/.8)).toFixed(4)})`;});
    s.draws.forEach(o=>{const p=eio(clamp((l-o.in)/o.len));o.e.style.strokeDasharray=o.L;o.e.style.strokeDashoffset=(o.L*(1-p)).toFixed(1);});
    s.rings.forEach(o=>{const p=eio(clamp((l-o.in)/1.6));o.e.style.strokeDasharray=`${(o.L*o.v*p).toFixed(1)} ${o.L}`;});
    s.spins.forEach(o=>o.e.setAttribute('transform',`rotate(${(l*o.sp).toFixed(2)})`));
    s.travel.forEach(o=>{const p=((l-.5)/3.2);const q=p<1?eio(clamp(p)):((l-3.7)/2.2)%1;const pt=o.p.getPointAtLength(o.L*clamp(q));o.e.setAttribute('cx',pt.x);o.e.setAttribute('cy',pt.y);o.e.style.opacity=l>.5?1:0;});
    if(s.sweep){const y=120+((l/2.4)%1)*840;s.sweep.style.top=y+'px';s.sweep.style.opacity=(.6*(1-Math.abs(((l/2.4)%1)-.5)*2)).toFixed(2);}
  });
  const cur=S.findIndex(s=>T>=s.t0&&T<s.t0+s.dur);const ci=cur<0?S.length-1:cur;
  document.getElementById('hudScene').innerHTML=`${MES} · <b>${String(ci+1).padStart(2,'0')}/${String(S.length).padStart(2,'0')}</b> · ${S[ci].label}`;
  segs.forEach((b,i)=>b.style.transform=`scaleX(${clamp((T-S[i].t0)/S[i].dur).toFixed(4)})`);
  const mm=Math.floor(T/60),ss=Math.floor(T%60);document.getElementById('hudTime').textContent=`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')} / ${String(Math.floor(TOTAL/60)).padStart(2,'0')}:${String(Math.round(TOTAL%60)).padStart(2,'0')}`;
}

/* ---------- reprodução e controles ---------- */
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(-960*s).toFixed(1)}px,${(-540*s).toFixed(1)}px) scale(${s})`;}
addEventListener('resize',fit);fit();
const capture=/[?&]capture/.test(location.search);if(capture)document.body.classList.add('capture');
let playing=!capture,last=performance.now();
const setPlay=v=>{playing=v;document.getElementById('bPlay').textContent=v?'❚❚':'▶';last=performance.now();};
const go=i=>{i=clamp(i,0,S.length-1);render(S[i].t0+.001);setPlay(true);};
const curIdx=()=>{const c=S.findIndex(s=>T>=s.t0&&T<s.t0+s.dur);return c<0?S.length-1:c;};
function loop(now){if(playing){T+=(now-last)/1000;if(T>=TOTAL){T=TOTAL;setPlay(false);}render(T);}last=now;requestAnimationFrame(loop);}
document.getElementById('ctl').addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;
  if(a==='play'){if(T>=TOTAL)render(0);setPlay(!playing);}else if(a==='next')go(curIdx()+1);else if(a==='prev')go(curIdx()-1);else if(a==='restart')go(0);else if(a==='fs')toggleFs();});
prog.addEventListener('click',e=>{const i=[...prog.children].indexOf(e.target.closest('i'));if(i>=0)go(i);});
const toggleFs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(T>=TOTAL)render(0);setPlay(!playing);}else if(e.key==='ArrowRight'||e.key==='PageDown')go(curIdx()+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(curIdx()-1);
  else if(e.key==='r'||e.key==='R')go(0);else if(e.key==='f'||e.key==='F')toggleFs();});
let idle;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),2200);});
window.__motion={total:TOTAL,seek:t=>render(t),scenes:S.map(s=>({id:s.id,t0:s.t0,dur:s.dur}))};
render(0);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
