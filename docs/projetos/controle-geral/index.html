<title>Controle Geral CDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D32B2B; --maroon: #7A1414; --green: #1B8A5A;
    --ink: #1A1A1A; --ink-soft: #6B6B6B; --line: #E4E1DC;
    --callout-bg: #FCEAE8; --panel-bg: #F5F4F1;
    --good: #1B8A5A; --warning: #C98500; --critical: #D32B2B;
    --bg: #fff; --panel: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
    font-size: 14px; line-height: 1.45;
    transition: background .25s ease, color .25s ease;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px 20px 64px; }

  .masthead { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:2px; }
  .masthead .tag { font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; color: var(--ink); }
  .masthead h1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; color: var(--red); text-transform:uppercase; letter-spacing:0.01em; margin:0; }
  .subtitle { font-size:12.5px; color: var(--ink-soft); margin: 2px 0 18px; font-weight:500; }
  .subtitle b { color: var(--ink); }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 18px; border-bottom: 1px solid var(--line); }
  nav.tabs button {
    appearance: none; border: none; background: transparent; color: var(--ink-soft);
    font-family: 'Inter', sans-serif; padding: 9px 13px; font-size: 12.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .02em; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active { color: var(--red); border-bottom-color: var(--red); }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .grid { display: grid; gap: 14px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 980px) { .grid.cols-4 { grid-template-columns: repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width: 620px) { .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }

  .kpi-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom: 22px; }
  .kpi-strip.cols-3 { grid-template-columns: repeat(3,1fr); }
  .kpi-cell { padding: 14px 16px; border-left: 4px solid var(--red); }
  .kpi-cell.maroon { border-left-color: var(--maroon); }
  .kpi-cell.green { border-left-color: var(--green); }
  .kpi-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color: var(--ink); margin-bottom:6px; }
  .kpi-value { font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; color: var(--ink); line-height:1; }
  .kpi-value.bad { color: var(--red); }
  .kpi-value.good { color: var(--green); }
  .kpi-sub { font-size:11px; color: var(--ink-soft); margin-top:4px; }
  @media (max-width: 980px) { .kpi-strip, .kpi-strip.cols-3 { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 620px) { .kpi-strip, .kpi-strip.cols-3 { grid-template-columns: 1fr; } }

  .callout { background: var(--callout-bg); border-left: 4px solid var(--red); padding: 14px 18px; font-size: 13.5px; font-weight:600; color:#5A1414; margin-bottom: 20px; border-radius: 2px; }

  .section-bar { background: var(--maroon); color:#fff; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:0.03em; padding: 10px 16px; margin: 26px 0 14px; display:flex; justify-content:space-between; align-items:baseline; }
  .section-bar:first-of-type { margin-top: 0; }
  .section-bar .tag { background: var(--red); font-size:11px; padding:2px 10px; border-radius:12px; font-family:'Inter',sans-serif; font-weight:700; text-transform:none; letter-spacing:normal; }
  .section-bar .pill.live { margin-left: 10px; }
  .section-note { color: var(--ink-soft); font-size: 12px; margin: -6px 0 14px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .card.pad-lg { padding: 18px 20px; }
  .chart-card { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px 14px; }
  .chart-card h4 { font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; margin:0 0 2px; color: var(--ink); }
  .chart-card .chart-meta { font-size:11.5px; color: var(--ink-soft); margin-bottom: 10px; }

  .tile .label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight:700; }
  .tile .value { font-family:'Oswald',sans-serif; font-size: 22px; font-weight: 600; color: var(--ink); }
  .tile .sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .tile .sub.good { color: var(--green); }
  .tile .sub.bad { color: var(--red); }

  .rank-list { display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height: 420px; overflow-y:auto; padding-right:4px; }
  .rank-row { display:grid; grid-template-columns: 28px 130px 1fr 60px; align-items:center; gap:8px; font-size:12.5px; padding:3px 0; }
  .rank-pos { font-family:'Oswald',sans-serif; font-weight:600; color: var(--ink-soft); }
  .rank-pos.top1 { color: var(--red); }
  .rank-pos.top3 { color: var(--maroon); }
  .rank-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-bar-track { background: var(--panel-bg); border-radius:4px; height:7px; overflow:hidden; }
  .rank-bar-fill { background: var(--red); height:100%; }
  .rank-bar-fill.maroon { background: var(--maroon); }
  .rank-qty { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color: var(--ink); }

  .aging-grid { display:grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
  .aging-card { border:1px solid var(--line); border-radius:6px; padding:16px 18px; }
  .aging-card .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color: var(--ink-soft); margin-bottom:8px; }
  .aging-card .val { font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; color: var(--red); }
  .aging-card.b2c .val { color: var(--maroon); }
  .aging-card .val-sub { font-size:11.5px; color: var(--ink-soft); margin-top:4px; }
  @media (max-width: 860px) { .aging-grid { grid-template-columns: 1fr 1fr; } }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .badge.alta { background: color-mix(in oklab, var(--critical) 18%, transparent); color: var(--critical); }
  .badge.media { background: color-mix(in oklab, var(--warning) 22%, transparent); color: #8a5a00; }
  .badge.baixa { background: color-mix(in oklab, var(--good) 16%, transparent); color: var(--good); }

  table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; color: var(--ink); }
  table.data th { text-align: left; color: var(--ink-soft); font-weight: 700; font-size: 11px; text-transform: uppercase;
    letter-spacing: .02em; border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
  table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.data tr:last-child td { border-bottom: none; }
  table.data tbody tr:hover { background: var(--panel-bg); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll-x { overflow-x: auto; }

  .bar-row { display: grid; grid-template-columns: 150px 1fr 64px; gap: 8px; align-items: center; padding: 3px 0; }
  .bar-row .lbl { font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 10px; background: var(--panel-bg); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-row .val { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight:600; }

  .note { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; border-left: 2px solid var(--line); padding-left: 8px; }
  .note.warn { border-left-color: var(--red); color: #5A1414; }
  .pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:100px; background:var(--panel-bg); color:var(--ink-soft); margin-left:6px; font-weight:600;}
  .pill.live { background: color-mix(in oklab, var(--green) 16%, transparent); color: var(--green); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: var(--ink-soft); }
  .legend span.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .kpi-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .kpi-row:last-child { border-bottom: none; }
  .kpi-row .k { color: var(--ink-soft); }
  .kpi-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  .gauge-wrap { display:flex; align-items:center; gap:16px; }
  .gauge-num { font-family:'Oswald',sans-serif; font-size: 28px; font-weight: 700; }
  .idx-box { flex:1; }

  .not-calc { background: var(--panel-bg); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--ink-soft); }

  .flex-between { display:flex; justify-content:space-between; align-items:baseline; }

  .filterbar { border: 1px solid var(--line); border-radius: 6px; background: var(--panel-bg); display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin: 0 0 18px; padding: 14px 16px; }
  .filterbar .fld { display: flex; flex-direction: column; gap: 4px; }
  .filterbar .fld label { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
  .filterbar input[type="date"], .filterbar select {
    font: inherit; font-size: 13px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px;
  }
  .filterbar button {
    font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
    color: #fff; background: var(--maroon); border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer;
  }
  .filterbar button:hover { background: var(--red); }
  .filterbar .status { flex-basis: 100%; font-size: 12px; color: var(--ink-soft); }

  footer.foot { text-align:left; padding: 18px 0 4px; color: var(--ink-soft); font-size: 11px; border-top: 1px solid var(--line); margin-top: 34px; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* ============================================================
     MODO FUTURE -- reskin so-CSS (paleta/fontes/glow), identico ao
     acervo dashfuture "Nexus 2099". Zero mudanca de HTML/JS: todo
     cor de grafico e escrita como var(--x) direto no SVG, entao
     trocar o valor da variavel repinta os graficos sem re-renderizar.
     ============================================================ */
  .theme-toggle {
    appearance: none; border: 1px solid var(--line); background: var(--panel-bg);
    color: var(--ink); border-radius: 100px; padding: 7px 14px 7px 12px;
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .03em;
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    margin-left: auto; transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .theme-toggle:hover { border-color: var(--red); }
  .theme-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; }
  .masthead { position: relative; }

  body[data-theme="future"] {
    background:
      radial-gradient(ellipse 900px 480px at 18% -8%, rgba(139,92,246,.15), transparent 60%),
      radial-gradient(ellipse 900px 480px at 88% 4%, rgba(45,212,238,.12), transparent 60%),
      var(--bg);
  }
  [data-theme="future"] { --red: #2dd4ee; --maroon: #8b5cf6; --green: #39ff9d;
    --ink: #e6f1ff; --ink-soft: #7f93b8; --line: #1e2c48;
    --callout-bg: rgba(233,61,214,.1); --panel-bg: #141b2d;
    --good: #39ff9d; --warning: #ffb020; --critical: #ff4d6a;
    --bg: #0a0e17; --panel: #0f1524;
  }
  [data-theme="future"] .wrap { position: relative; }
  [data-theme="future"] .masthead .tag { font-family:'Orbitron',sans-serif; font-weight:800; font-size:20px; letter-spacing:.1em; color: var(--ink); text-transform: uppercase; }
  [data-theme="future"] .masthead h1 { font-family:'Orbitron',sans-serif; font-weight:800; font-size:26px; letter-spacing:.02em;
    text-transform:uppercase; margin:0;
    background: linear-gradient(90deg, var(--red), var(--maroon) 55%, #e93dd6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(45,212,238,.15);
  }
  [data-theme="future"] .theme-toggle { background: var(--panel-bg); border-color: var(--line); }
  [data-theme="future"] .theme-toggle .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }

  [data-theme="future"] nav.tabs button { font-family: 'Inter', sans-serif; letter-spacing: .04em; }
  [data-theme="future"] nav.tabs button.active { text-shadow: 0 0 12px rgba(45,212,238,.5); }
  [data-theme="future"] section.panel.active { animation: dfFade .2s ease; }
  @keyframes dfFade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  [data-theme="future"] .kpi-strip { gap:12px; border-top:none; border-bottom:none; }
  [data-theme="future"] .kpi-cell { border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 10px;
    background: linear-gradient(160deg, rgba(20,27,45,.85), rgba(9,12,20,.85)); }
  [data-theme="future"] .kpi-label { color: var(--ink-soft); letter-spacing:0.08em; }
  [data-theme="future"] .kpi-value { font-family:'JetBrains Mono',monospace; }
  [data-theme="future"] .kpi-value.bad { text-shadow: 0 0 12px rgba(255,77,106,.4); }
  [data-theme="future"] .kpi-value.good { text-shadow: 0 0 12px rgba(57,255,157,.4); }

  [data-theme="future"] .section-bar { background: linear-gradient(90deg, rgba(139,92,246,.16), transparent 75%); border-left: 3px solid var(--maroon); font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:0.1em; border-radius: 0 8px 8px 0; }
  [data-theme="future"] .section-bar .tag { color: #04141a; border-radius:12px; }

  [data-theme="future"] .card { background: var(--panel); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  [data-theme="future"] .chart-card { border-radius: 10px; background: var(--panel); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  [data-theme="future"] .chart-card h4 { font-family:'Inter',sans-serif; }

  [data-theme="future"] .tile .value { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] .rank-pos { font-family:'JetBrains Mono',monospace; }
  [data-theme="future"] .rank-pos.top1 { color: #e93dd6; text-shadow: 0 0 8px rgba(233,61,214,.6); }
  [data-theme="future"] .rank-bar-fill { background: linear-gradient(90deg, var(--red), #e93dd6); }
  [data-theme="future"] .rank-qty { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] .aging-card { border-radius:10px; background: var(--panel); }
  [data-theme="future"] .aging-card .val { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] table.data th { letter-spacing: .06em; }
  [data-theme="future"] .num { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] .bar-row .val { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] .note.warn { color: #ffb4c2; }

  [data-theme="future"] .kpi-row .v { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] .gauge-num { font-family:'JetBrains Mono',monospace; }

  [data-theme="future"] .filterbar { border-radius: 10px; background: var(--panel-bg); }
  [data-theme="future"] .filterbar input[type="date"], [data-theme="future"] .filterbar select { background: var(--panel); border-radius: 6px; }
  [data-theme="future"] .filterbar button {
    color: #04141a; background: linear-gradient(90deg, var(--red), var(--maroon)); border-radius: 6px;
    box-shadow: 0 0 16px rgba(45,212,238,.3);
  }
  [data-theme="future"] .filterbar button:hover { background: linear-gradient(90deg, var(--red), var(--maroon)); filter: brightness(1.1); }

  /* ============================================================
     MODO ORBITA -- dark glassmorphism, ciano/azul neon, tipografia
     sistema fina + rotulos em uppercase. Mesmo mecanismo dos outros
     dois modos: so troca variavel CSS + overrides pontuais, zero
     mudanca de HTML/JS.
     ============================================================ */
  body[data-theme="orbita"] {
    background:
      radial-gradient(ellipse 900px 480px at 12% -6%, rgba(45,227,208,.16), transparent 60%),
      radial-gradient(ellipse 900px 480px at 90% 2%, rgba(61,155,255,.14), transparent 60%),
      var(--bg);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight:300;
  }
  [data-theme="orbita"] { --red:#2de3d0; --maroon:#3d9bff; --green:#39ff9d;
    --ink:#eafcfb; --ink-soft:#7fada3; --line:rgba(45,227,208,.22);
    --callout-bg:rgba(255,85,119,.12); --panel-bg:rgba(15,32,29,.55);
    --good:#39ff9d; --warning:#ffb020; --critical:#ff5577;
    --bg:#040a09; --panel:#0a1c19;
  }
  [data-theme="orbita"] .wrap { position: relative; }
  [data-theme="orbita"] .masthead .tag, [data-theme="orbita"] .masthead h1 { font-weight:700; }
  [data-theme="orbita"] .theme-toggle { background: var(--panel-bg); border-color: var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  [data-theme="orbita"] .theme-toggle .dot { box-shadow: 0 0 8px var(--red); }

  [data-theme="orbita"] nav.tabs button { letter-spacing: 1.1px; font-weight:600; }
  [data-theme="orbita"] .kpi-label, [data-theme="orbita"] .tile .label, [data-theme="orbita"] .aging-card .lbl,
  [data-theme="orbita"] table.data th, [data-theme="orbita"] .filterbar .fld label { letter-spacing: 1.1px; }
  [data-theme="orbita"] .kpi-strip { gap:12px; border-top:none; border-bottom:none; }
  [data-theme="orbita"] .kpi-cell { border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 10px;
    background: var(--panel-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  [data-theme="orbita"] .kpi-value { font-weight:700; }

  [data-theme="orbita"] .section-bar { background: rgba(45,227,208,.1); border-left: 3px solid var(--maroon); font-weight:700; letter-spacing:1.1px; border-radius: 0 8px 8px 0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  [data-theme="orbita"] .section-bar .tag { color: #04141a; border-radius:12px; }

  [data-theme="orbita"] .card, [data-theme="orbita"] .chart-card {
    background: var(--panel-bg); border-radius: 10px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  [data-theme="orbita"] .chart-card h4 { font-weight:600; }

  [data-theme="orbita"] .tile .value { font-weight:700; }
  [data-theme="orbita"] .rank-pos { font-weight:700; }
  [data-theme="orbita"] .rank-bar-fill { background: linear-gradient(90deg, var(--red), var(--maroon)); }
  [data-theme="orbita"] .rank-qty { font-weight:700; }

  [data-theme="orbita"] .aging-card { border-radius:10px; background: var(--panel-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  [data-theme="orbita"] .aging-card .val { font-weight:700; }

  [data-theme="orbita"] .num { font-weight:600; }

  [data-theme="orbita"] .bar-row .val { font-weight:600; }

  [data-theme="orbita"] .kpi-row .v { font-weight:700; }
  [data-theme="orbita"] .gauge-num { font-weight:700; }

  [data-theme="orbita"] .filterbar { border-radius: 10px; background: var(--panel-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  [data-theme="orbita"] .filterbar input[type="date"], [data-theme="orbita"] .filterbar select { background: var(--panel); border-radius: 6px; }
  [data-theme="orbita"] .filterbar button {
    color: #04141a; background: linear-gradient(90deg, var(--red), var(--maroon)); border-radius: 6px;
    box-shadow: 0 0 16px rgba(45,227,208,.3); font-weight:600;
  }
  [data-theme="orbita"] .filterbar button:hover { filter: brightness(1.1); }
</style>

<div class="wrap">

  <div class="masthead">
    <span class="tag">CDA |</span>
    <h1>Controle Geral — Aurora Suplementos</h1>
    <button class="theme-toggle" id="theme-toggle" type="button"><span class="dot"></span><span id="theme-toggle-label">Modo Future</span></button>
  </div>
  <div class="subtitle">
    Expedição: <b id="meta-periodo-exp">–</b> · Movimentação/Armazenagem: <b id="meta-periodo-mov">–</b>
    · Gerado em <b id="meta-gerado">–</b>

<script>
const DATA = JSON.parse(document.getElementById('DASHBOARD_DATA_JSON').textContent);
const CUBE = JSON.parse(document.getElementById('CUBE_DATA_JSON').textContent);

/* Modo Clean / Modo Future -- so troca a casca visual (CSS custom
   properties), nao mexe em dado nem em logica de nenhuma aba. */
function setupThemeToggle(){
  const btn = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  const CYCLE = ['clean', 'future', 'orbita'];
  const NEXT_LABEL = { clean: 'Modo Future', future: 'Modo Órbita', orbita: 'Modo Clean' };
  function apply(theme){
    if (theme === 'clean') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', theme);
    label.textContent = NEXT_LABEL[theme];
  }
  let saved = 'clean';
  try { saved = localStorage.getItem('cda-theme') || 'clean'; } catch(e) {}
  if (!CYCLE.includes(saved)) saved = 'clean';
  apply(saved);
  btn.addEventListener('click', () => {
    const current = document.body.getAttribute('data-theme') || 'clean';
    const next = CYCLE[(CYCLE.indexOf(current) + 1) % CYCLE.length];
    apply(next);
    try { localStorage.setItem('cda-theme', next); } catch(e) {}
  });
}
setupThemeToggle();
const SERIES = ['--red','--maroon'];
function cssvar(name){ return `var(${name})`; }
function fmtN(x, d=0){ if (x===null||x===undefined||Number.isNaN(x)) return '—'; return Number(x).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d}); }
function fmtPct(x, d=1){ if (x===null||x===undefined||Number.isNaN(x)) return '—'; return (x*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}) + '%'; }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------- small chart helpers (inline SVG, no deps) ---------- */
function sparkLine(container, points, opts={}){
  const w = opts.w || 640, h = opts.h || 160, pad = 28;
  const xs = points.map((_,i)=>i);
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys, 0), maxY = Math.max(...ys, 1);
  const xScale = i => pad + (i/(Math.max(points.length-1,1))) * (w - pad*2);
  const yScale = v => h - pad - ((v-minY)/((maxY-minY)||1)) * (h - pad*2);
  let path = points.map((p,i)=> (i===0?'M':'L') + xScale(i).toFixed(1) + ',' + yScale(p.y).toFixed(1)).join(' ');
  const area = path + ` L${xScale(points.length-1).toFixed(1)},${(h-pad).toFixed(1)} L${xScale(0).toFixed(1)},${(h-pad).toFixed(1)} Z`;
  const color = opts.color || cssvar('--red');
  const nTicks = Math.min(6, points.length);
  let ticks = '';
  for(let i=0;i<nTicks;i++){
    const idx = Math.round(i*(points.length-1)/(Math.max(nTicks-1,1)));
    ticks += `<text x="${xScale(idx).toFixed(1)}" y="${h-8}" font-size="9.5" fill="${cssvar('--ink-soft')}" text-anchor="middle">${esc(points[idx].x)}</text>`;
  }
  const gridY = [0,0.25,0.5,0.75,1].map(f => h-pad-f*(h-pad*2));
  const gridLines = gridY.map(y=>`<line x1="${pad}" x2="${w-pad}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${cssvar('--line')}" stroke-width="1"/>`).join('');
  const lastX = xScale(points.length-1), lastY = yScale(points[points.length-1].y);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="${color}"/>
    ${ticks}
  </svg>`;
}

function barList(container, rows, opts={}){
  // rows: [{label, value, max?, colorVar?, suffix?}]
  const max = opts.max || Math.max(...rows.map(r=>r.value), 1);
  container.innerHTML = rows.map(r => {
    const pct = Math.max(2, Math.min(100, (r.value/max)*100));
    const color = `var(${r.colorVar || '--red'})`;
    return `<div class="bar-row">
      <div class="lbl" title="${esc(r.label)}">${esc(r.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="val">${r.display !== undefined ? r.display : fmtN(r.value)}</div>
    </div>`;
  }).join('');
}

function table(container, headers, rows){
  container.innerHTML = `<div class="scroll-x"><table class="data"><thead><tr>${
    headers.map(h=>`<th class="${h.num?'num':''}">${esc(h.label)}</th>`).join('')
  }</tr></thead><tbody>${
    rows.map(r=>`<tr>${headers.map(h=>`<td class="${h.num?'num':''}">${h.fmt? h.fmt(r[h.key]) : esc(r[h.key])}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}

function tile(label, value, sub, subClass){
  return `<div class="card tile">
    <div class="label">${esc(label)}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub ${subClass||''}">${sub}</div>` : ''}
  </div>`;
}

function kpiCell(label, value, sub, border, valueClass){
  return `<div class="kpi-cell ${border||''}">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value ${valueClass||''}">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}

function rankList(rows, opts={}){
  // rows: [{label, value}], ja ordenadas desc
  const max = rows.length ? rows[0].value || 1 : 1;
  const barClass = opts.barClass || '';
  return `<div class="rank-list">${rows.map((r,i) => {
    const pct = max ? Math.max(1, (r.value/max)*100) : 0;
    const posClass = i===0 ? 'top1' : (i<3 ? 'top3' : '');
    return `<div class="rank-row">
      <span class="rank-pos ${posClass}">${i+1}º</span>
      <span class="rank-name" title="${esc(r.label)}">${esc(r.label)}</span>
      <div class="rank-bar-track"><div class="rank-bar-fill ${barClass}" style="width:${pct.toFixed(1)}%"></div></div>
      <span class="rank-qty">${fmtN(r.value)}</span>
    </div>`;
  }).join('') || '<div class="note">Nenhum dado no filtro selecionado.</div>'}</div>`;
}

function heatHour(container, hourCounts){
  const max = Math.max(...Object.values(hourCounts), 1);
  let html = '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px;">';
  for(let h=0; h<24; h++){
    const v = hourCounts[h] || 0;
    const t = v/max;
    const bg = `color-mix(in oklab, var(--red) ${Math.round(t*90+8)}%, var(--panel-bg))`;
    html += `<div title="${h}h: ${fmtN(v)}" style="aspect-ratio:1;border-radius:3px;background:${bg};"></div>`;
  }
  html += '</div><div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:4px;">';
  for(let h=0; h<24; h++){
    html += `<div style="font-size:8.5px;text-align:center;color:var(--ink-soft);">${h%2===0?h:''}</div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function notCalc(obj, label){
  return `<div class="not-calc"><b>${esc(label)}:</b> não calculável com os dados atuais. ${esc(obj.motivo)}</div>`;
}

function fmtDiaBR(iso){
  // "2026-07-01" -> "01/07"
  if (!iso) return '';
  const [, mm, dd] = iso.split('-');
  return `${dd}/${mm}`;
}
function fmtConferente(nome){
  // "aurora.otaviok" -> "Otaviok" (mesmo padrao de exibicao do relatorio de referencia)
  const semPrefixo = String(nome||'').replace(/^aurora\./i, '');
  return semPrefixo.charAt(0).toUpperCase() + semPrefixo.slice(1);
}
function livePill(){ return `<span class="pill live">responde ao filtro</span>`; }
function staticNote(){ return ''; }

/* ---------- client-side cube filtering (vanilla JS, no deps) ---------- */
function filterCube(rows, f={}){
  return rows.filter(r =>
    (!f.from || r.dia >= f.from) &&
    (!f.to || r.dia <= f.to) &&
    (!f.dimVal || String(r[f.dimKey]) === f.dimVal) &&
    (!f.dimVal2 || String(r[f.dimKey2]) === f.dimVal2));
}
function sumBy(rows, field){ return rows.reduce((a,r) => a + (r[field]||0), 0); }
function groupSumBy(rows, groupKey, valueKey){
  const m = new Map();
  for (const r of rows){
    const k = r[groupKey]===null||r[groupKey]===undefined ? '(sem valor)' : String(r[groupKey]);
    m.set(k, (m.get(k)||0) + (r[valueKey]||0));
  }
  return m;
}
function cubeDateRange(cubeName){
  let min=null, max=null;
  for (const r of CUBE[cubeName]){
    if (min===null || r.dia<min) min = r.dia;
    if (max===null || r.dia>max) max = r.dia;
  }
  return [min, max];
}

/* ============================================================ */
/* TAB DEFINITIONS                                                */
/* ============================================================ */
// amplitude selecionavel no calendario de filtro, fixa em todas as abas --
// nao limita os NUMEROS quando nenhum filtro esta ativo (esses continuam
// refletindo todo o historico disponivel por area, ver cubeDateRange()).
const FILTRO_MIN = '2026-07-01';
const FILTRO_MAX = '2026-09-09';

const AREA_CONFIG = {
  recebimento:  {cube:'recebimento',  dimKey:'turno',      dimLabel:'Turno',      dimKey2:'transportadora', dimLabel2:'Transportadora'},
  recebimento_terceiros: {cube:'recebimento_terceiros', dimKey:'empresa', dimLabel:'Empresa'},

  avarias:      {cube:'avarias',      dimKey:'motivo',      dimLabel:'Motivo'},
  expedicao:    {cube:'expedicao',    dimKey:'canal',       dimLabel:'Canal',      dimKey2:'status_entrega', dimLabel2:'Status de Entrega'},
  conferentes:  {cube:'conferentes',  dimKey:'conferente',  dimLabel:'Conferente'},

function init(){

  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');

    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.className = i===0 ? 'active' : '';
    btn.onclick = () => selectTab(t.id);
    btn.id = 'tabbtn-' + t.id;
    tabsEl.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel' + (i===0 ? ' active' : '');
    panel.id = 'panel-' + t.id;
    panelsEl.appendChild(panel);
  });

  setupFilterbar();
  TABS.forEach(t => t.render(document.getElementById('panel-' + t.id)));
  refreshFilterbarForTab(activeTabId);

  // deep link via hash
  const h = location.hash.replace('#','');
  if (TABS.some(t=>t.id===h)) selectTab(h);
}

function selectTab(id){
  TABS.forEach(t => {
    document.getElementById('tabbtn-'+t.id).className = t.id===id ? 'active' : '';
    document.getElementById('panel-'+t.id).className = 'panel' + (t.id===id ? ' active':'');
  });
  activeTabId = id;
  location.hash = id;
  refreshFilterbarForTab(id);
}

function setupFilterbar(){
  document.getElementById('flt-from').addEventListener('change', onFilterChange);
  document.getElementById('flt-to').addEventListener('change', onFilterChange);
  document.getElementById('flt-dim').addEventListener('change', onFilterChange);
  document.getElementById('flt-dim2').addEventListener('change', onFilterChange);
  document.getElementById('flt-clear').addEventListener('click', () => {
    document.getElementById('flt-from').value = '';
    document.getElementById('flt-to').value = '';
    document.getElementById('flt-dim').value = '';
    document.getElementById('flt-dim2').value = '';
    onFilterChange();
  });
}

function populateDimSelect(selectEl, cubeName, dimKey, currentVal, displayFmt){
  const vals = [...new Set(CUBE[cubeName].map(r => r[dimKey]).filter(v => v!==null && v!==undefined))].sort();
  const fmt = displayFmt || (v=>v);
  selectEl.innerHTML = `<option value="">Todos</option>` + vals.map(v => `<option value="${esc(v)}">${esc(fmt(v))}</option>`).join('');
  selectEl.value = currentVal || '';
}

function refreshFilterbarForTab(tabId){
  const cfg = AREA_CONFIG[tabId];
  if (!cfg){ document.getElementById('filterbar').style.display = 'none'; return; }
  document.getElementById('filterbar').style.display = '';

  const fromEl = document.getElementById('flt-from'), toEl = document.getElementById('flt-to');
  fromEl.min = FILTRO_MIN; fromEl.max = FILTRO_MAX;
  toEl.min = FILTRO_MIN; toEl.max = FILTRO_MAX;
  fromEl.value = currentFilter.from || '';
  toEl.value = currentFilter.to || '';

  document.getElementById('flt-dim-label').textContent = cfg.dimLabel;
  const dim1Fmt = tabId === 'conferentes' ? fmtConferente : undefined;
  populateDimSelect(document.getElementById('flt-dim'), cfg.cube, cfg.dimKey, dimValByTab[tabId].dim1, dim1Fmt);

  const dim2Wrap = document.getElementById('flt-dim2-wrap');
  if (cfg.dimKey2){
    dim2Wrap.style.display = '';
    document.getElementById('flt-dim2-label').textContent = cfg.dimLabel2;
    populateDimSelect(document.getElementById('flt-dim2'), cfg.cube, cfg.dimKey2, dimValByTab[tabId].dim2);
  } else {
    dim2Wrap.style.display = 'none';
  }

  updateFilterStatus();
}

function onFilterChange(){
  currentFilter.from = document.getElementById('flt-from').value || null;
  currentFilter.to = document.getElementById('flt-to').value || null;
  dimValByTab[activeTabId].dim1 = document.getElementById('flt-dim').value || '';
  dimValByTab[activeTabId].dim2 = document.getElementById('flt-dim2').value || '';
  updateFilterStatus();
  const tab = TABS.find(t => t.id === activeTabId);
  tab.render(document.getElementById('panel-' + activeTabId));
}

function updateFilterStatus(){
  const cfg = AREA_CONFIG[activeTabId];
  const parts = [];
  if (currentFilter.from || currentFilter.to) parts.push(`${currentFilter.from || 'início'} – ${currentFilter.to || 'fim'}`);
  if (cfg && dimValByTab[activeTabId].dim1) parts.push(`${cfg.dimLabel}: ${dimValByTab[activeTabId].dim1}`);
  if (cfg && cfg.dimKey2 && dimValByTab[activeTabId].dim2) parts.push(`${cfg.dimLabel2}: ${dimValByTab[activeTabId].dim2}`);
  document.getElementById('flt-status').textContent = parts.length ? `Filtro ativo: ${parts.join(' · ')}` : 'Sem filtro (dados completos)';
}

function baseFilterFor(tabId){
  const cfg = AREA_CONFIG[tabId];
  // sem filtro explicito = janela completa do seletor (01/07-31/08), nao
  // "sem limite" -- algumas fontes (movimentacao, devolucao) tem historico
  // anterior a 01/07 mantido nos dados pra outras finalidades, que nao deve
  // vazar pros paineis "periodo completo" quando o usuario nao filtrou nada.
  return {
    from: currentFilter.from || FILTRO_MIN,
    to: currentFilter.to || FILTRO_MAX,
    dimKey: cfg.dimKey, dimVal: dimValByTab[tabId].dim1,
    dimKey2: cfg.dimKey2, dimVal2: dimValByTab[tabId].dim2,
  };
}

function abcDonutLike(container, obj){
  const total = Object.values(obj).reduce((a,b)=>a+b,0) || 1;

    const v = obj[k]||0, pct = v/total;
    return `<div class="bar-row" style="grid-template-columns:60px 1fr 90px;">
      <div class="lbl">Classe ${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(pct*100).toFixed(1)}%;background:var(${colors[k]})"></div></div>
      <div class="val">${fmtN(v)} (${fmtPct(pct)})</div>
    </div>`;
  }).join('');
}

function idxDetail(idx){
  const comps = Object.entries(idx.componentes || {}).map(([k,c]) => `
    <div class="kpi-row"><span class="k">${esc(k.replace(/_/g,' '))} (peso ${fmtN(c.peso,2)})</span>

  return `
    <div class="gauge-wrap">
      <div class="gauge-num" style="color:${scoreColor(idx.score)}">${idx.score!==null?fmtN(idx.score,0):'—'}</div>
      <div class="idx-box"><div class="bar-track"><div class="bar-fill" style="width:${idx.score||0}%;background:${scoreColor(idx.score)}"></div></div></div>
    </div>
    <div style="margin-top:8px;">${comps}</div>
  `;
}

function scoreColor(s){
  if (s===null || s===undefined) return cssvar('--ink-soft');
  if (s>=80) return cssvar('--good');
  if (s>=60) return cssvar('--warning');
  return cssvar('--critical');
}

function filteredExpedicao(){
  const rows = filterCube(CUBE.expedicao, baseFilterFor('expedicao'));
  const pedidos = sumBy(rows,'pedidos'), faturados = sumBy(rows,'faturados'), atrasados = sumBy(rows,'atrasados'), com_status = sumBy(rows,'com_status');
  return {
    pedidos_recebidos: pedidos,

}

function renderConferentes(root){
  root.innerHTML = `
    <div class="kpi-strip" id="conf-tiles"></div>

    <div class="section-bar">Ranking de Conferentes ${livePill()} <span class="tag" id="conf-periodo-tag"></span></div>
    <div class="grid cols-2">
      <div class="chart-card">
        <h4>B2B</h4>
        <div class="chart-meta" id="conf-meta-b2b"></div>
        <div id="conf-rank-b2b"></div>
      </div>
      <div class="chart-card">
        <h4>B2C</h4>
        <div class="chart-meta" id="conf-meta-b2c"></div>
        <div id="conf-rank-b2c"></div>
      </div>
    </div>

    <div class="section-bar">Aging por Item — Média ${livePill()} <span class="tag" id="conf-periodo-tag2"></span></div>
    <div class="aging-grid" id="conf-aging"></div>
  `;

  const base = baseFilterFor('conferentes');
  const [minDia, maxDia] = cubeDateRange('conferentes');
  const periodoTxt = `${fmtDiaBR(currentFilter.from||minDia)} a ${fmtDiaBR(currentFilter.to||maxDia)}`;
  document.getElementById('conf-periodo-tag').textContent = periodoTxt;
  document.getElementById('conf-periodo-tag2').textContent = periodoTxt;

  function statsForCanal(canal){
    const rows = filterCube(CUBE.conferentes.filter(r=>r.canal===canal), base);

    let itens, qtdApontada, qtdLiberada, semApontamento;
    if (dimValByTab.conferentes.dim1) {
      // conferente especifico selecionado: kpi-strip mostra os numeros DELE,
      // consistente com o ranking abaixo (que ja fica reduzido a 1 linha) --
      // usa o mesmo `rows` filtrado, nao o total do canal inteiro.
      itens = sumBy(rows,'itens');
      qtdApontada = sumBy(rows,'qtd_apontada');
      qtdLiberada = sumBy(rows,'qtd_liberada');
      semApontamento = sumBy(rows,'sem_apontamento');
    } else {
      // sem filtro de conferente: total do canal, incluindo itens ainda sem
      // conferente atribuido (so existem em conferentes_totais, que nao tem
      // dimensao de conferente)
      const totRows = filterCube(CUBE.conferentes_totais.filter(r=>r.canal===canal), {from:base.from, to:base.to});
      itens = sumBy(totRows,'itens');
      qtdApontada = sumBy(totRows,'qtd_apontada');
      qtdLiberada = sumBy(totRows,'qtd_liberada');
      semApontamento = sumBy(totRows,'sem_apontamento');
    }
    const agingSoma = sumBy(rows,'aging_soma_horas');
    const agingN = sumBy(rows,'aging_n');
    const porConf = groupSumBy(rows,'conferente','qtd_apontada');
    const ranking = [...porConf.entries()].map(([label,value])=>({label:fmtConferente(label),value})).sort((a,b)=>b.value-a.value);
    return {
      itens, qtdApontada, qtdLiberada, semApontamento, ranking,
      pctConcluido: qtdLiberada ? qtdApontada/qtdLiberada : null,
      agingMedioDias: agingN ? (agingSoma/agingN)/24 : null,
      agingN,
    };
  }

  const b2b = statsForCanal('B2B');
  const b2c = statsForCanal('B2C');
  const agingEstatico = DATA.aging_conferentes_mediano;

  document.getElementById('conf-tiles').innerHTML = [
    kpiCell('Apontado B2B', fmtN(b2b.qtdApontada), b2b.pctConcluido!==null?fmtPct(b2b.pctConcluido)+' concluído':'—'),
    kpiCell('Apontado B2C', fmtN(b2c.qtdApontada), b2c.pctConcluido!==null?fmtPct(b2c.pctConcluido)+' concluído':'—', 'maroon'),
    kpiCell('Aging médio B2B', b2b.agingMedioDias!==null?fmtN(b2b.agingMedioDias,1)+' d':'—', b2b.agingN?fmtN(b2b.agingN)+' itens':'—'),
    kpiCell('Aging médio B2C', b2c.agingMedioDias!==null?fmtN(b2c.agingMedioDias,1)+' d':'—', b2c.agingN?fmtN(b2c.agingN)+' itens':'—', 'maroon'),
  ].join('');

  document.getElementById('conf-meta-b2b').textContent = `${fmtN(b2b.itens)} itens liberados · ${b2b.pctConcluido!==null?fmtPct(b2b.pctConcluido):'—'} concluído`;
  document.getElementById('conf-meta-b2c').textContent = `${fmtN(b2c.itens)} itens liberados · ${b2c.pctConcluido!==null?fmtPct(b2c.pctConcluido):'—'} concluído`;

  document.getElementById('conf-rank-b2b').innerHTML = rankList(b2b.ranking, {barClass:''});
  document.getElementById('conf-rank-b2c').innerHTML = rankList(b2c.ranking, {barClass:'maroon'});

  document.getElementById('conf-aging').innerHTML = [
    `<div class="aging-card">
      <div class="lbl">Aging médio B2B</div>
      <div class="val">${b2b.agingMedioDias!==null?fmtN(b2b.agingMedioDias,1)+' d':'—'}</div>
      <div class="val-sub">Mediana ${agingEstatico.B2B.aging_mediano_dias!==null?fmtN(agingEstatico.B2B.aging_mediano_dias,1)+' d':'—'} (período completo) · ${fmtN(b2b.agingN)} itens no filtro</div>
    </div>`,
    `<div class="aging-card b2c">
      <div class="lbl">Aging médio B2C</div>
      <div class="val">${b2c.agingMedioDias!==null?fmtN(b2c.agingMedioDias,1)+' d':'—'}</div>
      <div class="val-sub">Mediana ${agingEstatico.B2C.aging_mediano_dias!==null?fmtN(agingEstatico.B2C.aging_mediano_dias,1)+' d':'—'} (período completo) · ${fmtN(b2c.agingN)} itens no filtro</div>
    </div>`,
    `<div class="aging-card">
      <div class="lbl">Sem apontamento — B2B</div>
      <div class="val">${fmtN(b2b.semApontamento)}</div>
      <div class="val-sub">de ${fmtN(b2b.itens)} liberados</div>
    </div>`,
    `<div class="aging-card b2c">
      <div class="lbl">Sem apontamento — B2C</div>
      <div class="val">${fmtN(b2c.semApontamento)}</div>
      <div class="val-sub">de ${fmtN(b2c.itens)} liberados</div>
    </div>`,
  ].join('');
}

        <h4>Top produtos devolvidos</h4>
        <div id="dev-produtos"></div>
      </div>
    </div>
  `;

  const rows = filterCube(CUBE.devolucao, baseFilterFor('devolucao'));
  const totalDev = sumBy(rows,'devolucoes');
  const totalQtd = sumBy(rows,'qtd');

  const devStatic = DATA.devolucao;

  document.getElementById('dev-tiles').innerHTML = [
    kpiCell('Registros', fmtN(totalDev)),
    kpiCell('Qtd. recebida', fmtN(totalQtd), '', 'maroon'),
    kpiCell('Motivos distintos', fmtN(new Set(rows.map(r=>r.motivo)).size)),
    kpiCell('Taxa de descarte', fmtPct(devStatic.taxa_descarte_sobre_qtd_recebida), 'período completo — não recalculável por filtro', 'maroon'),
  ].join('');

  const porMotivo = groupSumBy(rows, 'motivo', 'devolucoes');
  barList(document.getElementById('dev-motivo'),
    [...porMotivo.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v],i)=>({label:k,value:v,colorVar:SERIES[i%SERIES.length]})));

  const porDia = groupSumBy(rows, 'dia', 'devolucoes');
  const evo = [...porDia.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([x,y])=>({x:x.slice(5),y}));
  document.getElementById('dev-evo').innerHTML = evo.length ? sparkLine(null, evo, {w:520,h:160,color:cssvar('--red')}) : '<div class="note">Nenhum dado no filtro selecionado.</div>';

  barList(document.getElementById('dev-ofensor'),
    devStatic.por_ofensor.map((r,i)=>({label:r.ofensor, value:r.registros, colorVar:SERIES[i%SERIES.length], display: r.registros+' ('+fmtPct(r.pct_registros)+')'})));
  table(document.getElementById('dev-produtos'),
    [{key:'codigo',label:'Código'},{key:'descricao',label:'Descrição'},{key:'registros',label:'Registros',num:true,fmt:fmtN},{key:'qtd',label:'Qtd',num:true,fmt:fmtN}],
    devStatic.top_produtos_devolvidos.slice(0,10));
}

    <div class="kpi-strip" id="av-tiles"></div>

    <div class="grid cols-2">
      <div class="chart-card">
        <h4>Por motivo ${livePill()}</h4>
        <div id="av-motivo"></div>
      </div>
      <div class="chart-card">
        <h4>Evolução diária</h4>
        <div id="av-evo"></div>
      </div>
    </div>

    <div class="chart-card" style="margin-top:14px;">
      <h4>Produtos mais afetados</h4>
      <div id="av-produtos"></div>
    </div>
  `;

  const rows = filterCube(CUBE.avarias, baseFilterFor('avarias'));
  const totalReg = sumBy(rows,'registros');
  const totalQtd = sumBy(rows,'qtd');

  const avStatic = DATA.avarias;
  const porMotivo = groupSumBy(rows, 'motivo', 'registros');
  const motivoTop = [...porMotivo.entries()].sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('av-tiles').innerHTML = [
    kpiCell('Registros', fmtN(totalReg)),
    kpiCell('Quantidade total', fmtN(totalQtd), '', 'maroon'),
    kpiCell('Motivos distintos', fmtN(porMotivo.size)),
    kpiCell('Motivo mais frequente', motivoTop ? esc(motivoTop[0]) : '—', motivoTop ? fmtN(motivoTop[1])+' registros' : '', 'maroon'),
  ].join('');

  barList(document.getElementById('av-motivo'),
    [...porMotivo.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k,value:v,colorVar:SERIES[i%SERIES.length]})));

  const porDia = groupSumBy(rows, 'dia', 'registros');
  const evo = [...porDia.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([x,y])=>({x:x.slice(5),y}));
  document.getElementById('av-evo').innerHTML = evo.length ? sparkLine(null, evo, {w:520,h:160,color:cssvar('--red')}) : '<div class="note">Nenhum dado no filtro selecionado.</div>';

  table(document.getElementById('av-produtos'),
    [{key:'codigo',label:'Código'},{key:'descricao',label:'Descrição'},{key:'registros',label:'Registros',num:true,fmt:fmtN},{key:'qtd',label:'Qtd',num:true,fmt:fmtN}],
    avStatic.top_produtos_afetados);
}
