<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon Telemetria · Setembro 2026 · AS</title>
<style>
  :root{
    /* tema "im" do Resumo Mensal e Anual — vermelho e bordô sobre papel claro */
    --paper:#f5f2f0; --paper-2:#fbf9f8;
    --orange:#e60000; --red-hi:#ff2d1f; --cyan:#7a1414; --bordo-2:#4f0c0c;
    --text:#221a16; --muted:#6b5f58; --faint:#a3978f;
    --green:#1b8a5a; --amber:#b7791f; --red:#b91c1c; --neutral:#4a4a4a;
    --hair:rgba(122,20,20,.10); --hair-2:rgba(34,26,22,.07);
    --glass:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.62));
    --sh:0 1px 2px rgba(34,26,22,.05),0 10px 24px -14px rgba(34,26,22,.16),0 28px 56px -34px rgba(122,20,20,.26);
    --sh-hi:0 2px 4px rgba(34,26,22,.06),0 18px 34px -16px rgba(34,26,22,.20),0 40px 70px -34px rgba(122,20,20,.34);
    --r-xl:28px; --r-lg:24px; --r-md:20px;
    --display:"Oswald","Arial Narrow","Liberation Sans Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
    --sans:"Inter","Segoe UI","Helvetica Neue",Arial,"Liberation Sans",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --head:60px; --nav:98px;
    --e-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;color:var(--text);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1200px 700px at 0% 0%,#fff 0%,transparent 60%),linear-gradient(180deg,var(--paper-2),var(--paper))}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:8px}
  body.busy .stage,body.busy .nav button{pointer-events:none}

  /* ---------- fundo vivo: brilho por capítulo, estrelas em 3 camadas, grade ---------- */
  .glow{position:fixed;left:0;top:0;width:120vmax;height:120vmax;z-index:0;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(230,0,0,.13) 0%,rgba(230,0,0,.05) 26%,rgba(122,20,20,.03) 42%,transparent 62%);
    transition:transform 1.6s cubic-bezier(.22,.9,.24,1)}
  #stars,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #stars{z-index:0}
  #fx{z-index:3}
  .grid-ov{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(122,20,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(122,20,20,.045) 1px,transparent 1px);
    background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%)}

  /* ---------- HUD superior ---------- */
  .hud{position:fixed;inset:0 0 auto 0;height:var(--head);z-index:6;display:flex;align-items:center;gap:20px;padding:0 24px;
    background:rgba(251,249,248,.72);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:11px;font:800 15px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
  .brand .mk{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:14px;letter-spacing:0;
    background:linear-gradient(140deg,var(--red-hi),var(--orange) 45%,var(--cyan));box-shadow:0 6px 16px -6px rgba(230,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
  .brand b{color:var(--orange)}
  .mission{font:600 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mission em{font-style:normal;color:var(--text)}
  .hud .sp{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid var(--hair);
    font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;box-shadow:0 1px 2px rgba(34,26,22,.04)}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(27,138,90,.15);animation:blink 1.8s infinite}
  @keyframes blink{50%{opacity:.3}}
  .clockbox{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:99px;background:var(--text);color:#fff;white-space:nowrap}
  .clockbox > i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9}
  .clockbox[data-state="pre"] > i{background:#ffb020;animation:blink .5s infinite}
  .clockbox[data-state="flight"] > i{background:#ff4a3c;animation:blink 1.4s infinite}
  .clockbox[data-state="hold"] > i{background:#a3978f}
  .clockbox[data-state="landed"] > i{background:#3ddc84}
  .clockbox b{font:700 13px/1 var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:99px;background:var(--orange);min-width:92px;text-align:center}
  .clockbox[data-state="pre"] b{background:var(--cyan)}
  .clockbox[data-state="hold"] b{background:var(--neutral)}
  .clockbox[data-state="landed"] b{background:var(--green)}
  .mprog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:rgba(122,20,20,.06);overflow:hidden}
  .mprog i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--cyan));transform-origin:left;transform:scaleX(0)}

  /* ---------- palco, cenas, sobreposição de transição ---------- */
  .stage{position:fixed;top:var(--head);bottom:var(--nav);left:0;right:0;z-index:2}
  .scene{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;visibility:hidden;opacity:0;scrollbar-width:thin;transform-origin:50% 45%}
  .scene.active,.scene.tr{visibility:visible}
  .scene.active{opacity:1}
  .scene.clone{pointer-events:none}
  .tx{position:fixed;top:var(--head);bottom:var(--nav);left:0;right:0;z-index:4;pointer-events:none;overflow:hidden}
  .sc{max-width:1320px;margin:0 auto;min-height:100%;padding:22px 32px 24px;display:flex;flex-direction:column;gap:16px}
  .sc-head{display:flex;flex-direction:column;gap:8px}
  .eyebrow{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 10px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--hair);
    font:700 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--orange)}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(230,0,0,.14)}
  .eyebrow span{color:var(--muted)}
  h2{font:800 clamp(30px,3.7vw,54px)/.98 var(--display);text-transform:uppercase;letter-spacing:-.005em;margin:2px 0 0;color:var(--text)}
  h2 small{display:block;font:400 14.5px/1.5 var(--sans);text-transform:none;letter-spacing:0;color:var(--muted);margin-top:10px;max-width:74ch}
  @media (min-width:1101px){h2{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}h2 small{max-width:44ch;margin:0 0 4px;text-align:right}}

  /* ---------- bento ---------- */
  .bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
  .c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-5{grid-column:span 5}.c-7{grid-column:span 7}.c-8{grid-column:span 8}.c-12{grid-column:span 12}
  .r-2{grid-row:span 2}.r-3{grid-row:span 3}.r-4{grid-row:span 4}
  .card{position:relative;border-radius:var(--r-lg);padding:20px 22px;background:var(--glass);border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--sh),inset 0 0 0 1px var(--hair),inset 0 1px 0 #fff;backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);
    transition:transform .45s var(--e-out)}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--sh-hi);opacity:0;transition:opacity .45s var(--e-out);pointer-events:none}
  .card:hover{transform:translateY(-3px)}
  .card:hover::after{opacity:1}
  .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .lbl{font:700 10.5px/1.25 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .card-h b{font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text);padding:6px 10px;border-radius:99px;background:rgba(122,20,20,.06)}
  .big{font:800 clamp(36px,3.4vw,54px)/1 var(--display);letter-spacing:-.01em;margin-top:8px}
  .big .lbl{font-size:11px;letter-spacing:.2em;vertical-align:middle}
  .sub{font-size:12.5px;color:var(--muted);margin-top:8px}
  .t-red{color:var(--orange)}.t-bordo{color:var(--cyan)}
  .bar{height:8px;border-radius:99px;background:rgba(34,26,22,.06);overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red-hi),var(--orange) 40%,var(--cyan));transform-origin:left}
  .leitura{margin:auto 0 0;padding:15px 20px;border-radius:var(--r-md);background:var(--glass);border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--sh),inset 0 0 0 1px var(--hair);font-size:14px;color:#3d3330;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .leitura::before{content:"LEITURA";display:inline-block;margin-right:12px;padding:5px 9px;border-radius:99px;background:var(--orange);color:#fff;
    font:700 9.5px/1 var(--mono);letter-spacing:.22em;vertical-align:1px}
  .leitura b{color:var(--text)}

  /* qualidade adaptativa: se a máquina não sustenta 40 fps, o vidro dos cards vira gradiente translúcido (sem blur ao vivo) */
  body.lite .card,body.lite .leitura{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,255,255,.84))}
  body.lite .hero{background:linear-gradient(135deg,#ff2d1f 0%,var(--orange) 34%,#a80d0d 70%,var(--cyan) 100%)}
  body.lite .launch,body.lite .landing{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.92) 70%,rgba(246,238,235,.98))}

  /* ---------- tooltip ---------- */
  #tip{position:fixed;left:0;top:0;z-index:9;pointer-events:none;padding:9px 12px;border-radius:12px;background:rgba(34,26,22,.93);color:#fff;
    font:600 11.5px/1.45 var(--mono);white-space:nowrap;box-shadow:0 12px 28px -10px rgba(34,26,22,.5);opacity:0;transition:opacity .15s}
  #tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
  #tip.show{opacity:1}

  /* ---------- foguete (SVG compartilhado) ---------- */
  .rk{display:block;width:100%;height:100%;overflow:visible}
  .rk .flame-wrap{transform-box:fill-box;transform-origin:50% 0;transform:scale(0);transition:transform .45s var(--e-out)}
  .rk[data-fl="1"] .flame-wrap{transform:scale(.3,.25)}
  .rk[data-fl="2"] .flame-wrap{transform:scale(.8,.75)}
  .rk[data-fl="3"] .flame-wrap{transform:scale(1.15,1.35)}
  .rk .fl-a,.rk .fl-b,.rk .fl-c{transform-box:fill-box;transform-origin:50% 0}
  .rk .fl-a{animation:flk .09s infinite alternate}
  .rk .fl-b{animation:flk2 .13s infinite alternate}
  .rk .fl-c{animation:flk .07s infinite alternate-reverse}
  @keyframes flk{to{transform:scale(.9,.84)}}
  @keyframes flk2{to{transform:scale(.84,1.1)}}
  .rk .fglow{opacity:0;transition:opacity .5s}
  .rk[data-fl="2"] .fglow,.rk[data-fl="3"] .fglow{opacity:1}
  .rk .heat{opacity:0;transition:opacity .7s}
  .rk[data-heat="1"] .heat{opacity:1}
  .rk .heat-in{transform-box:fill-box;transform-origin:50% 50%;animation:heat .18s infinite alternate}
  @keyframes heat{to{transform:scale(1.08);opacity:.8}}

  /* ---------- 01 · ignição ---------- */
  .b1{grid-auto-rows:minmax(0,auto)}
  .hero{background:linear-gradient(135deg,#ff2d1f 0%,var(--orange) 34%,#a80d0d 70%,var(--cyan) 100%);color:#fff;border-color:rgba(255,255,255,.25);
    box-shadow:0 2px 4px rgba(122,20,20,.18),0 24px 48px -22px rgba(230,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden;padding:24px 28px 26px}
  .hero::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(600px 220px at 85% -20%,rgba(255,255,255,.35),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
  .hero .eyebrow{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff}
  .hero .eyebrow::before{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  .hero .eyebrow span{color:rgba(255,255,255,.75)}
  .hero-n{position:relative;font:800 clamp(72px,9.2vw,140px)/.86 var(--display);letter-spacing:-.02em;margin:18px 0 10px;text-shadow:0 10px 30px rgba(79,12,12,.35)}
  .hero-l{position:relative;font:700 13px/1.3 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.88)}
  .kpi .big{font-size:clamp(34px,3vw,48px)}
  .ticker{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;font:600 12px/1.4 var(--mono);color:var(--muted);padding:16px 22px}
  .ticker b{color:var(--orange);font-weight:800}
  .launch{padding:0;overflow:visible;display:grid;grid-template-columns:1fr 1fr;min-height:520px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.85) 70%,rgba(246,238,235,.95))}
  .pad-scene{position:relative;overflow:visible}
  .pad-scene::before{content:"";position:absolute;left:0;right:0;bottom:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(122,20,20,.35),transparent)}
  .tower{position:absolute;left:18%;bottom:44px;width:10px;height:62%;border-left:2px solid rgba(122,20,20,.28);border-right:2px solid rgba(122,20,20,.28);
    background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(122,20,20,.22) 9px 11px)}
  .pad{position:absolute;left:50%;bottom:34px;width:120px;height:12px;border-radius:6px;transform:translateX(-50%);
    background:linear-gradient(180deg,#d9cfca,#b9aca5);box-shadow:0 6px 16px -6px rgba(34,26,22,.4)}
  .pad::before,.pad::after{content:"";position:absolute;top:-5px;width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);animation:blink 1.2s infinite}
  .pad::before{left:8px}.pad::after{right:8px;animation-delay:.6s}
  .rk-fly{position:absolute;left:50%;bottom:46px;width:96px;height:256px;margin-left:-48px;z-index:2;will-change:transform}
  .contrail{position:absolute;left:50%;bottom:120px;width:6px;height:120%;margin-left:-3px;border-radius:6px;opacity:0;transform-origin:bottom;transform:scaleY(.2);
    background:linear-gradient(0deg,rgba(255,255,255,.95),rgba(214,204,199,.55) 40%,transparent);transition:opacity 1.2s,transform 1.6s var(--e-out)}
  .launch.launched .contrail{opacity:.9;transform:scaleY(1)}
  .cd{position:absolute;left:50%;top:18%;width:200px;margin-left:-100px;text-align:center;z-index:3;opacity:0;
    font:800 150px/1 var(--display);color:var(--orange);text-shadow:0 14px 40px rgba(230,0,0,.35)}
  .tele{list-style:none;margin:0;padding:26px 22px 26px 6px;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .tele li{display:flex;flex-direction:column;gap:5px;padding-left:14px;border-left:2px solid rgba(230,0,0,.25)}
  .tele li span{font:700 9.5px/1.2 var(--mono);letter-spacing:.18em;color:var(--muted)}
  .tele li b{font:800 19px/1.1 var(--display);letter-spacing:.01em}

  /* ---------- 02 · trajetória ---------- */
  .flow{padding:30px 22px 22px}
  .flow canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:inherit}
  .nodes{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .node{background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .35s var(--e-out)}
  .node:hover{transform:translateY(-3px)}
  .node .dot{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font:700 13px/1 var(--mono);color:var(--cyan);
    background:linear-gradient(160deg,#fff,#f4ecea);border:1px solid rgba(122,20,20,.16);box-shadow:0 8px 18px -10px rgba(122,20,20,.45),inset 0 1px 0 #fff;
    transition:transform .35s var(--e-out),background .35s,color .35s}
  .node.ret .dot{color:var(--red)}
  .node.sel .dot{background:linear-gradient(140deg,var(--red-hi),var(--orange) 50%,var(--cyan));color:#fff;transform:scale(1.08);border-color:transparent;
    box-shadow:0 14px 28px -12px rgba(230,0,0,.7)}
  .node .nm{font:700 11px/1.1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .node .nv{font:800 clamp(20px,2vw,28px)/1.05 var(--display)}
  .node .nu{font-size:11px;color:var(--muted);line-height:1.3}
  .detail{align-items:stretch}
  .dt-h{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .dt-name{font:800 clamp(28px,2.6vw,40px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin-top:10px}
  .dt-h .sub{margin-top:14px;font-size:13px}
  .dt-h .dv{display:block;font:800 clamp(72px,7vw,112px)/.9 var(--display);letter-spacing:-.02em;color:var(--orange);margin-bottom:6px}
  .dt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .dt-grid > div{padding:14px 14px 12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--hair-2)}
  .dt-grid .v{font:800 24px/1.1 var(--display);margin-top:8px}
  .dt-txt{margin-top:16px;font-size:14px;color:#3d3330;line-height:1.6}

  /* ---------- 03 · pulso ---------- */
  .pulse-card{display:flex;align-items:center;justify-content:center;padding:14px}
  .pulse-wrap{position:relative;width:min(100%,560px,calc(100svh - var(--head) - var(--nav) - 230px));min-width:260px;aspect-ratio:1}
  .pulse-wrap svg{position:absolute;inset:0;width:100%;height:100%}
  .radar{position:absolute;left:50%;top:50%;width:86.2%;aspect-ratio:1;margin:-43.1% 0 0 -43.1%;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 0deg,rgba(230,0,0,.16) 0deg 12deg,transparent 12deg);
    -webkit-mask-image:radial-gradient(circle,transparent 0 28.8%,#000 29.2%);mask-image:radial-gradient(circle,transparent 0 28.8%,#000 29.2%);
    transition:transform .5s var(--e-out)}
  .radar::before{content:"";position:absolute;left:50%;top:0;width:2px;height:50%;margin-left:-1px;background:linear-gradient(0deg,transparent 0 58%,var(--orange));border-radius:2px}
  .spoke-o{stroke:var(--orange);stroke-width:4.5;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%}
  .spoke-c{stroke:var(--cyan);stroke-width:2.6;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 0}
  .we{opacity:.32}
  .hit{fill:transparent;cursor:crosshair}
  .dlab{font:600 9.5px var(--mono);fill:var(--faint);text-anchor:middle;dominant-baseline:middle}
  .dlab.on{fill:var(--orange);font-weight:800}
  .day-list{display:grid;gap:12px}
  .day-row{display:grid;grid-template-columns:150px 1fr 92px;gap:12px;align-items:center}
  .day-row .bar{margin:0;height:9px}
  .day-row .bar i{transform:scaleX(0);transition:transform .5s var(--e-out)}
  .day-row .val{font:800 20px/1 var(--display);text-align:right}
  .scrub{display:flex;align-items:center;gap:12px;margin-top:16px}
  .scrub input{flex:1;accent-color:var(--orange)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font:600 10.5px/1 var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:16px}
  .legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

  /* ---------- 04 · canais ---------- */
  .split{margin-bottom:16px}
  .split .row{display:flex;justify-content:space-between;gap:10px;font:700 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:9px}
  .split .track{display:flex;height:34px;border-radius:12px;overflow:hidden;background:rgba(34,26,22,.05);gap:3px}
  .split .track i{display:flex;align-items:center;padding:0 12px;font:800 13px/1 var(--display);letter-spacing:.06em;white-space:nowrap;transform-origin:left;border-radius:10px}
  .split .b2b{background:linear-gradient(90deg,var(--bordo-2),var(--cyan));color:#fff}
  .split .b2c{background:linear-gradient(90deg,var(--orange),var(--red-hi));color:#fff;justify-content:flex-end}
  .upp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .upp > div{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid var(--hair-2)}
  .upp .big{font-size:clamp(72px,7vw,112px);line-height:.9;letter-spacing:-.02em}
  .orbit{display:flex;align-items:center;justify-content:center;padding:18px}
  .orb{position:relative;width:100%;max-width:520px;aspect-ratio:1}
  .orb .ring{position:absolute;left:50%;top:50%;width:var(--s);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed rgba(122,20,20,.18)}
  .orb .core{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#ff4a3c,var(--orange) 45%,var(--cyan));color:#fff;box-shadow:0 0 0 10px rgba(230,0,0,.08),0 20px 40px -14px rgba(230,0,0,.6)}
  .orb .core span{font:700 10.5px/1 var(--mono);letter-spacing:.22em;opacity:.85}
  .orb .core b{font:800 clamp(22px,2.4vw,32px)/1.05 var(--display)}
  .arm{position:absolute;inset:0;animation:orb var(--T) linear infinite;animation-delay:var(--dl);animation-direction:var(--dir);will-change:transform}
  .sat{position:absolute;top:50%;left:calc(50% + var(--R));width:var(--d);aspect-ratio:1;transform:translate(-50%,-50%)}
  .sat-in{position:absolute;inset:0;animation:orb var(--T) linear infinite;animation-delay:var(--dl);animation-direction:var(--cdir)}
  .sat-in i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a80,var(--orange) 60%,#b30000);opacity:var(--o);
    box-shadow:0 6px 14px -6px rgba(230,0,0,.6);transition:transform .25s var(--e-out)}
  .sat:hover .sat-in i{transform:scale(1.12)}
  .sat-in span{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;font:700 12px/1.2 var(--display);letter-spacing:.03em}
  .sat-in span small{display:block;font:600 10px/1.2 var(--mono);color:var(--muted);letter-spacing:.04em}
  @keyframes orb{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .scene:not(.active):not(.clone) .arm,.scene:not(.active):not(.clone) .sat-in,.scene:not(.active):not(.clone) .rk *{animation-play-state:paused}
  table.cl{width:100%;border-collapse:collapse;font-size:13px}
  table.cl th{font:700 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 10px 10px 0;border-bottom:1px solid var(--hair)}
  table.cl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair-2);vertical-align:middle}
  table.cl tr:last-child td{border-bottom:0}
  table.cl .r{text-align:right;white-space:nowrap}
  .cellbar{position:relative;height:22px;border-radius:8px;background:rgba(34,26,22,.05);min-width:96px;overflow:hidden}
  .cellbar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,rgba(122,20,20,.85),rgba(230,0,0,.55));transform-origin:left}
  .cellbar span{position:relative;font:700 11.5px/22px var(--mono);padding-left:8px;color:#fff;text-shadow:0 1px 2px rgba(79,12,12,.45)}

  /* ---------- 05 · tripulação ---------- */
  .seg{display:inline-flex;padding:3px;border-radius:99px;background:rgba(34,26,22,.06)}
  .seg button{border:0;background:none;padding:7px 13px;border-radius:99px;font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:background .25s,color .25s}
  .seg button[aria-pressed="true"]{background:var(--text);color:#fff}
  .rank{display:grid;gap:11px}
  .rank-row{display:grid;grid-template-columns:30px 120px 1fr 78px;gap:12px;align-items:center;font-size:13.5px}
  .rank-row .p{font:700 11px/1 var(--mono);color:var(--faint)}
  .rank-row.top .p{color:#fff;background:var(--orange);border-radius:8px;padding:5px 0;text-align:center}
  .rank-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-row .tr{height:9px;border-radius:99px;background:rgba(34,26,22,.06);overflow:hidden}
  .rank-row .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--orange));transform-origin:left}
  .rank-row .q{font:800 15px/1 var(--display);text-align:right}
  .eq{display:flex;align-items:flex-end;gap:7px;height:200px;padding-top:26px}
  .eq .b{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;position:relative}
  .eq .b i{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--cyan),rgba(122,20,20,.22));transform-origin:bottom}
  .eq .b.pk i{background:linear-gradient(180deg,var(--red-hi),var(--orange) 40%,rgba(230,0,0,.25));box-shadow:0 10px 22px -8px rgba(230,0,0,.6)}
  .eq .b span{font:600 10px/1 var(--mono);color:var(--faint)}
  .eq .b em{position:absolute;top:-4px;font:800 13px/1 var(--display);font-style:normal;color:var(--orange);white-space:nowrap}

  /* ---------- 06 · alcance ---------- */
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-width:372px;margin:0 auto}
  .tile{aspect-ratio:1;border-radius:13px;border:1px solid rgba(122,20,20,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;
    background:rgba(230,0,0,var(--a,.05));transition:transform .3s var(--e-out),box-shadow .3s}
  .tile:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 22px -10px rgba(122,20,20,.55)}
  .tile b{font:800 14px/1 var(--display);letter-spacing:.06em}
  .tile small{font:600 9.5px/1 var(--mono);color:inherit;opacity:.85}
  .tile.hot{box-shadow:0 10px 24px -10px rgba(230,0,0,.75)}
  .tile.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--text)}
  .uf-big{font:800 clamp(72px,8vw,128px)/.88 var(--display);letter-spacing:-.02em;color:var(--orange)}
  .uf-m{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .uf-m > div{padding:14px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--hair-2)}
  .uf-m .v{font:800 26px/1.1 var(--display);margin-top:8px}
  .tp-row{display:grid;grid-template-columns:1fr 74px 140px;gap:12px;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--hair-2)}
  .tp-row:last-child{border-bottom:0}
  .tp-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tp-row .pz{display:flex;align-items:center;gap:9px;font:800 13px/1 var(--display);white-space:nowrap}
  .tp-row .pz i{height:8px;border-radius:99px;display:block;transform-origin:left}

  /* ---------- 07 · retorno ---------- */
  .devol .big{font-size:clamp(64px,6.6vw,104px);line-height:.9;letter-spacing:-.02em}
  .stack{display:flex;height:30px;border-radius:12px;overflow:hidden;margin:18px 0 12px;gap:3px;background:rgba(34,26,22,.05)}
  .stack i{display:block;height:100%;border-radius:9px;transform-origin:left}
  .keyl{display:grid;gap:7px;font-size:13px}
  .keyl div{display:flex;justify-content:space-between;gap:10px}
  .keyl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px;vertical-align:-1px}
  .mot{display:grid;gap:10px;margin-top:16px}
  .mot-row{display:grid;grid-template-columns:1fr 70px;gap:10px;font-size:13px;align-items:center}
  .mot-row .bar{margin-top:6px;height:7px}
  .ring-g{display:flex;align-items:center;gap:18px}
  .ring-svg{width:108px;height:108px;flex:none}
  .ring-g .big{font-size:clamp(36px,3.2vw,50px)}
  .landing{padding:0;overflow:visible;min-height:300px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.85) 75%,rgba(246,238,235,.95))}
  .landing .card-h{position:absolute;left:20px;right:20px;top:18px;margin:0;z-index:1}
  .land-fly{position:absolute;left:50%;bottom:46px;width:74px;height:198px;margin-left:-37px;z-index:2;will-change:transform}
  .landing .pad{bottom:34px}
  .landing::before{content:"";position:absolute;left:12%;right:12%;bottom:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(122,20,20,.35),transparent)}
  .restart{border:0;border-radius:var(--r-lg);padding:18px 20px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;
    background:linear-gradient(135deg,var(--red-hi),var(--orange) 45%,var(--cyan));box-shadow:0 18px 36px -16px rgba(230,0,0,.7),inset 0 1px 0 rgba(255,255,255,.3);
    font:700 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;transition:transform .35s var(--e-out)}
  .restart:hover{transform:translateY(-3px)}

  /* ---------- trilha da missão (rodapé) ---------- */
  .nav{position:fixed;inset:auto 0 0 0;height:var(--nav);z-index:6;display:flex;align-items:stretch;gap:18px;padding:0 22px;
    background:rgba(251,249,248,.78);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid var(--hair)}
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl button{width:42px;height:42px;border-radius:14px;border:1px solid var(--hair);background:#fff;display:grid;place-items:center;font-size:12px;color:var(--text);
    box-shadow:0 6px 14px -10px rgba(34,26,22,.5);transition:transform .3s var(--e-out)}
  .ctl button:hover{transform:translateY(-2px)}
  .ctl #play{width:50px;height:50px;border-radius:16px;border:0;background:linear-gradient(140deg,var(--red-hi),var(--orange) 50%,var(--cyan));color:#fff;box-shadow:0 12px 24px -10px rgba(230,0,0,.75)}
  .track{position:relative;flex:1;min-width:0}
  .track svg.path,.done-wrap,#marks,.ship,#trail{pointer-events:none}
  .track{overflow:hidden}
  .track svg.path{position:absolute;left:0;top:6px;width:100%;height:52px;overflow:visible}
  .done-wrap{position:absolute;left:0;top:6px;width:100%;height:52px;overflow:hidden;will-change:transform}
  .done-wrap svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;will-change:transform}
  .tmk{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2px solid rgba(122,20,20,.35);transition:background .3s,border-color .3s,transform .3s}
  .tmk.passed{background:var(--cyan);border-color:var(--cyan)}
  .tmk.on{background:var(--orange);border-color:#fff;box-shadow:0 0 0 3px var(--orange),0 0 14px rgba(230,0,0,.6);transform:scale(1.15)}
  .ship{position:absolute;left:0;top:0;width:56px;height:22px;z-index:2;opacity:0;transition:opacity .5s;will-change:transform}
  .ship.vis{opacity:1}
  .ship svg{display:block;width:100%;height:100%;overflow:visible}
  .ship .mfl{transform-box:fill-box;transform-origin:100% 50%;transition:transform .35s}
  .ship[data-fl="0"] .mfl{transform:scaleX(0)}
  .ship[data-fl="2"] .mfl{transform:scaleX(1.7)}
  .ship .mfl-in{transform-box:fill-box;transform-origin:100% 50%;animation:mflk .08s infinite alternate}
  @keyframes mflk{to{transform:scale(.8,.86)}}
  #trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .chapters{position:absolute;left:0;right:0;bottom:8px;display:grid;grid-template-columns:repeat(7,1fr)}
  .chap{border:0;background:none;padding:6px 2px;text-align:center;min-width:0;color:var(--faint);font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
  .chap b{margin-right:6px}
  .chap.done{color:var(--cyan)}
  .chap.on{color:var(--orange)}
  .chap:hover{color:var(--text)}

  /* ---------- sobreposições das transições ---------- */
  .ov{position:absolute;pointer-events:none}
  .ov-rocket{left:50%;bottom:0;width:84px;height:224px}
  .ov-exhaust{left:-10%;right:-10%;bottom:-30%;height:70%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,176,32,.55),rgba(230,0,0,.25) 55%,transparent);transform-origin:50% 100%}
  .ov-radar{left:50%;top:45%;width:150vmax;height:150vmax;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0deg,rgba(230,0,0,.32) 46deg,rgba(230,0,0,0) 48deg),repeating-radial-gradient(circle,rgba(122,20,20,.14) 0 1px,transparent 1px 70px)}
  .ov-curtain{top:-50%;bottom:-50%;left:-15%;width:130%;background:linear-gradient(90deg,var(--cyan),var(--orange) 55%,var(--red-hi));
    box-shadow:0 0 80px rgba(230,0,0,.45)}
  .ov-curtain::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.16) 0 2px,transparent 2px 34px)}
  .ov-speed{inset:0;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(230,0,0,.18) 22px 23px,transparent 23px 61px)}
  .ov-seam{left:0;right:0;top:50%;height:3px;background:linear-gradient(90deg,transparent,var(--orange),#fff,var(--orange),transparent);box-shadow:0 0 24px 6px rgba(230,0,0,.45)}
  .ov-tunnel{left:50%;top:50%;width:140vmax;height:140vmax;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(122,20,20,.18) 0deg .6deg,transparent .6deg 7deg);
    -webkit-mask-image:radial-gradient(circle,transparent 0 8%,#000 30%,transparent 70%);mask-image:radial-gradient(circle,transparent 0 8%,#000 30%,transparent 70%)}
  .ov-heat{left:50%;top:0;width:120vmax;height:80vmax;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,214,120,.85),rgba(255,122,40,.55) 35%,rgba(230,0,0,.25) 60%,transparent)}
  .ov-fade{inset:0;background:var(--paper-2)}

  /* ---------- responsivo ---------- */
  @media (max-width:1100px){
    .bento{grid-template-columns:repeat(6,minmax(0,1fr))}
    .c-5,.c-7,.c-8,.c-12{grid-column:span 6}
    .c-3,.c-4{grid-column:span 3}
    .r-2,.r-3,.r-4{grid-row:auto}
    .launch{min-height:440px}
    .dt-grid{grid-template-columns:1fr 1fr}
    .landing{min-height:280px}
  }
  @media (max-width:900px){
    .mission{display:none}
    .nodes{grid-template-columns:1fr;gap:14px}
    .node{flex-direction:row;text-align:left;gap:14px}
    .node .dot{flex:none}
    .chap span{display:none}
  }
  @media (max-width:700px){
    :root{--nav:90px;--head:56px}
    .sc{padding:16px 16px 18px}
    .bento > *{grid-column:1/-1 !important}
    .hud{padding:0 14px;gap:10px}
    .hud .pill{display:none}
    .brand{font-size:12.5px;letter-spacing:.12em;gap:8px}
    .brand .mk{width:28px;height:28px}
    .clockbox{padding:4px}
    .clockbox b{min-width:0;font-size:12px;padding:6px 9px}
    .launch{grid-template-columns:1fr;min-height:0}
    .pad-scene{height:330px}
    .tele{padding:4px 20px 22px}
    .upp .big{font-size:56px}
    .day-row{grid-template-columns:104px 1fr 76px}
    .rank-row{grid-template-columns:26px 92px 1fr 64px}
    .tp-row{grid-template-columns:1fr 54px 104px}
    .nav{padding:0 10px;gap:8px}
    .ctl #prev,.ctl #next{display:none}
    .chap b{margin:0}
    .leitura::before{display:block;width:max-content;margin:0 0 8px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>

const flow = {cv: $('#flowCv'), pts: [], segL: [], L: 0, parts: []};

function drawFx(dt){

  fx.clearRect(0, 0, innerWidth, innerHeight); fxDirty = true;

    fx.fillStyle = `rgba(${p.c},${(p.a * (1 - p.age / p.life)).toFixed(3)})`;

}
const rectOf = sel => { const e = $(sel); return e ? e.getBoundingClientRect() : null; };

/* ============================ fundo: estrelas em 3 camadas, parallax e warp ============================ */
const sc = $('#stars'), sx = sc.getContext('2d');
const LAYERS = [{f: .5, r: .7, v: 6, a: .16, p: 6, len: 40, c: '122,20,20'}, {f: .32, r: 1.1, v: 14, a: .22, p: 14, len: 90, c: '34,26,22'}, {f: .18, r: 1.7, v: 28, a: .30, p: 28, len: 170, c: '230,0,0'}];
let stars = [], mx = 0, my = 0, pmx = 0, pmy = 0;
const W = {w: 0, dir: 1, t0: -1, amp: 1, dur: 1150};
function warp(dir, amp = 1){ if(reduce) return; W.dir = dir; W.amp = amp; W.t0 = performance.now(); }
function sizeStars(){
  const dpr = Math.min(2, devicePixelRatio || 1); sc.width = innerWidth * dpr; sc.height = innerHeight * dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(innerWidth * innerHeight / (document.body.classList.contains('lite') ? 9000 : 5200));
  stars = LAYERS.map(L => Array.from({length: Math.round(n * L.f)}, () => ({x: Math.random() * innerWidth, y: Math.random() * innerHeight})));
  sizeFx(); layoutTrack();
}
let starAcc = 0, starTick = 0;
function drawStars(dt, now){
  starAcc += dt; if(W.t0 < 0 && (++starTick & 1)) return; dt = starAcc; starAcc = 0;
  if(W.t0 >= 0){ const k = (now - W.t0) / W.dur; W.w = k >= 1 ? 0 : Math.pow(Math.sin(Math.PI * k), 1.4) * W.amp; if(k >= 1) W.t0 = -1; }
  pmx += (mx - pmx) * .06; pmy += (my - pmy) * .06;
  sx.clearRect(0, 0, innerWidth, innerHeight);
  const s = dt / 1000, warping = W.w > .03;
  LAYERS.forEach((L, li) => {
    const v = L.v * (1 + W.w * 30) * s * W.dir, ox = pmx * L.p, oy = pmy * L.p * .6;
    sx.beginPath();
    if(warping){ sx.strokeStyle = `rgba(${L.c},${(L.a + W.w * .15).toFixed(3)})`; sx.lineWidth = L.r; }
    else sx.fillStyle = `rgba(${L.c},${L.a})`;
    for(const p of stars[li]){
      p.y += v; if(p.y > innerHeight + 10) { p.y -= innerHeight + 20; p.x = Math.random() * innerWidth; } else if(p.y < -10){ p.y += innerHeight + 20; p.x = Math.random() * innerWidth; }
      const x = p.x + ox, y = p.y + oy;
      if(warping){ sx.moveTo(x, y); sx.lineTo(x, y - W.dir * L.len * W.w); }
      else { sx.moveTo(x + L.r, y); sx.arc(x, y, L.r, 0, 6.3); }
    }
    warping ? sx.stroke() : sx.fill();
  });
}

const TR = {W: 0, x0: 0, x1: 0, base: 40, amp: 22};
const trackY = u => TR.base - TR.amp * Math.sin(Math.PI * u);
const trackX = u => TR.x0 + u * (TR.x1 - TR.x0);
function layoutTrack(){
  const W = $('#track').getBoundingClientRect().width; if(!W) return;

function shipTo(i){ const to = i / 6; if(reduce){ ship.u = to; ship.t0 = -1; return; } ship.from = ship.u; ship.to = to; ship.t0 = performance.now(); }
const trail = {P: [], dpr: 1, ctx: $('#trail').getContext('2d'), dirty: false};
function drawShip(now, dt){
  let u, tilt = 0, speed = 0;
  if(ship.t0 >= 0){
    const k = Math.min(1, (now - ship.t0) / ship.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

  } else u = cur / 6 + (cur < 6 && !busy ? Math.min(1, elapsed / DUR[cur]) * (1 / 6) * .3 : 0);

    }
  }
}

  () => { stagger($$('#s4 .sc-head, #s4 .bento > .card'), 0, 70); growX($$('#s4 .split .track i'), 260, 80); growX($$('#s4 .cellbar i'), 420, 60); stagger($$('#s4 .sat'), 300, 70, [{opacity: 0}, {opacity: 1}]); },
  () => { stagger($$('#s5 .sc-head, #s5 .bento > .card'), 0, 70); rank($('#confRank'), D.conf, confCol, 260); rank($('#opRank'), D.oper, 1, 420); growY($$('#s5 .eq .b i'), 260, 50); },
  () => { stagger($$('#s6 .sc-head, #s6 .bento > .card'), 0, 70); stagger($$('#s6 .tile'), 160, 40, [{opacity: 0, transform: 'scale(.6)'}, {opacity: 1, transform: 'none'}]); growX($$('#s6 .tp-row .pz i'), 420, 60); },
  () => { stagger($$('#s7 .sc-head, #s7 .bento > *'), 0, 70); growX($$('#s7 .stack i'), 320, 160); growX($$('#s7 .mot .bar i'), 420, 60);
    stagger($$('#s7 .ring-svg'), 380, 120, [{opacity: 0, transform: 'rotate(-140deg) scale(.8)'}, {opacity: 1, transform: 'none'}]); landing(); },
];
const LEAVE = [
  (to, dir) => { clearSeq(); if(clk.state === 'pre' || clk.state === 'hold'){ clk.state = 'flight'; ship.vis = true; if(!SEQ.fly){ SEQ.fly = $('#rkFly').animate([{transform: 'translateY(-130vh)'}, {transform: 'translateY(-130vh)'}], {duration: 1, fill: 'forwards'}); } $('#launch').classList.add('launched'); } },
  null, null, null, null, null,
  (to, dir) => { clearSeq(); ship.landed = 0; if(dir === -1) clk.state = 'flight'; },
];
function enterScene(i, dir){ const s = scenes[i]; countUp(s); if(ENTER[i]) ENTER[i](dir); }

/* ============================ transições temáticas entre capítulos ============================ */
const tx = $('#tx');
function ov(cls, html = ''){ const d = document.createElement('div'); d.className = 'ov ' + cls; d.innerHTML = html; tx.appendChild(d); return d; }
function cloneScene(s, clip){
  const c = s.cloneNode(true); c.classList.add('clone', 'active'); c.classList.remove('tr'); c.removeAttribute('id'); c.inert = true; c.setAttribute('aria-hidden', 'true');
  $$('[id]', c).forEach(e => e.removeAttribute('id')); if(clip) c.style.clipPath = clip;
  $('#stage').appendChild(c); c.scrollTop = s.scrollTop; return c;
}
// cada função recebe (sai, entra, direção); ao voltar, a mesma função toca ao contrário com os papéis trocados
const TX = [
  // Ignição → Trajetória: decolagem
  (o, n, dir) => { o.style.zIndex = 1; n.style.zIndex = 2; const r = ov('ov-rocket', rocketSVG()); r.firstChild.dataset.fl = '3'; const ex = ov('ov-exhaust');
    return [A(o, [{transform: 'translateY(0)', opacity: 1, easing: 'cubic-bezier(.55,0,.8,.2)'}, {transform: 'translateY(-70%)', opacity: 0, offset: .6}, {transform: 'translateY(-105%)', opacity: 0}], {direction: dir, easing: 'linear'}),
      A(n, [{transform: 'translateY(100%)', opacity: 0, easing: 'cubic-bezier(.3,0,.6,1)'}, {transform: 'translateY(55%)', opacity: 1, offset: .32, easing: EOUT}, {transform: 'translateY(0)', opacity: 1}], {direction: dir, easing: 'linear'}),
      A(r, [{transform: 'translate(-50%,40vh)'}, {transform: 'translate(-50%,-120vh)'}], {direction: dir, easing: EIN}),
      A(ex, [{opacity: 0, transform: 'scale(.6)'}, {opacity: .9, transform: 'scale(1)', offset: .35}, {opacity: 0, transform: 'scale(1.5)'}], {direction: dir})]; },
  // Trajetória → Pulso: varredura de radar
  (o, n, dir) => { o.style.zIndex = 1; n.style.zIndex = 2; const rd = ov('ov-radar');
    return [A(n, [{clipPath: 'circle(0% at 50% 45%)'}, {clipPath: 'circle(80% at 50% 45%)'}], {direction: dir}),
      A(o, [{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: 'scale(.96)'}], {direction: dir}),
      A(rd, [{opacity: 0, transform: 'translate(-50%,-50%) rotate(0deg) scale(.25)'}, {opacity: 1, transform: 'translate(-50%,-50%) rotate(220deg) scale(1)', offset: .6}, {opacity: 0, transform: 'translate(-50%,-50%) rotate(340deg) scale(1.2)'}], {direction: dir, easing: 'linear'})]; },
  // Pulso → Canais: cortina diagonal com linhas de velocidade
  (o, n, dir) => { const cu = ov('ov-curtain'), sl = ov('ov-speed');
    return [A(cu, [{transform: 'translateX(-140%) skewX(-16deg)', easing: EIN}, {transform: 'translateX(0) skewX(-16deg)', offset: .5, easing: EOUT}, {transform: 'translateX(140%) skewX(-16deg)'}], {direction: dir, duration: 860, easing: 'linear'}),
      A(sl, [{opacity: 0, transform: 'translateX(-30%)'}, {opacity: 1, transform: 'translateX(0)', offset: .5}, {opacity: 0, transform: 'translateX(30%)'}], {direction: dir, duration: 860, easing: 'linear'}),
      A(o, [{opacity: 1, transform: 'translateX(0)'}, {opacity: 1, transform: 'translateX(-4%)', offset: .5}, {opacity: 0, transform: 'translateX(-4%)', offset: .5001}, {opacity: 0, transform: 'translateX(-4%)'}], {direction: dir, duration: 860, easing: 'linear'}),
      A(n, [{opacity: 0, transform: 'translateX(6%)'}, {opacity: 0, transform: 'translateX(6%)', offset: .5}, {opacity: 1, transform: 'translateX(3%)', offset: .5001, easing: EOUT}, {opacity: 1, transform: 'translateX(0)'}], {direction: dir, duration: 860, easing: 'linear'})]; },
  // Canais → Tripulação: separação de estágio
  (o, n, dir) => { const top = cloneScene(o, 'inset(0 0 50% 0)'), bot = cloneScene(o, 'inset(50% 0 0 0)'), seam = ov('ov-seam');
    top.style.zIndex = bot.style.zIndex = 3; n.style.zIndex = 1;
    return [A(o, [{opacity: 0}, {opacity: 0}], {direction: dir}),
      A(top, [{transform: 'translateY(0) rotate(0deg)', opacity: 1, easing: EOUT}, {transform: 'translateY(-2%) rotate(0deg)', opacity: 1, offset: .22, easing: 'cubic-bezier(.5,0,.75,0)'}, {transform: 'translateY(-58%) rotate(-2.5deg)', opacity: 0}], {direction: dir, easing: 'linear'}),
      A(bot, [{transform: 'translateY(0) rotate(0deg)', opacity: 1, easing: EOUT}, {transform: 'translateY(2%) rotate(0deg)', opacity: 1, offset: .22, easing: 'cubic-bezier(.5,0,.75,0)'}, {transform: 'translateY(58%) rotate(2.5deg)', opacity: 0}], {direction: dir, easing: 'linear'}),
      A(seam, [{opacity: 0, transform: 'translateY(-50%) scaleX(0)'}, {opacity: 1, transform: 'translateY(-50%) scaleX(1)', offset: .2}, {opacity: 0, transform: 'translateY(-50%) scaleX(1)', offset: .55}, {opacity: 0, transform: 'translateY(-50%) scaleX(1)'}], {direction: dir, easing: 'linear'}),
      A(n, [{opacity: 0, transform: 'scale(.93)'}, {opacity: 0, transform: 'scale(.93)', offset: .3, easing: EOUT}, {opacity: 1, transform: 'scale(1)'}], {direction: dir, easing: 'linear'})]; },
  // Tripulação → Alcance: zoom de aproximação
  (o, n, dir) => { o.style.zIndex = 2; n.style.zIndex = 1; const tu = ov('ov-tunnel');
    return [A(o, [{transform: 'scale(1)', opacity: 1}, {transform: 'scale(1.85)', opacity: 0}], {direction: dir, easing: EIN}),
      A(n, [{transform: 'scale(.6)', opacity: 0}, {transform: 'scale(.6)', opacity: 0, offset: .2, easing: EOUT}, {transform: 'scale(1)', opacity: 1}], {direction: dir, easing: 'linear'}),
      A(tu, [{opacity: 0, transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)'}, {opacity: .9, transform: 'translate(-50%,-50%) scale(1.2) rotate(10deg)', offset: .45}, {opacity: 0, transform: 'translate(-50%,-50%) scale(2.4) rotate(20deg)'}], {direction: dir, easing: 'linear'})]; },
  // Alcance → Retorno: desfoque de movimento e brilho de reentrada
  (o, n, dir) => { const g1 = cloneScene(o), g2 = cloneScene(o), heat = ov('ov-heat');
    o.style.zIndex = 3; g1.style.zIndex = g2.style.zIndex = 2; n.style.zIndex = 1;
    return [A(o, [{transform: 'translateY(0)', opacity: 1, easing: 'cubic-bezier(.5,0,.75,0)'}, {transform: 'translateY(-38%)', opacity: 0, offset: .55}, {transform: 'translateY(-38%)', opacity: 0}], {direction: dir, easing: 'linear'}),
      A(g1, [{transform: 'translateY(0)', opacity: 0, easing: 'ease-in'}, {transform: 'translateY(-11%)', opacity: .3, offset: .3, easing: 'ease-out'}, {transform: 'translateY(-30%)', opacity: 0, offset: .6}, {transform: 'translateY(-30%)', opacity: 0}], {direction: dir, easing: 'linear'}),
      A(g2, [{transform: 'translateY(0)', opacity: 0, easing: 'ease-in'}, {transform: 'translateY(-5%)', opacity: .16, offset: .3, easing: 'ease-out'}, {transform: 'translateY(-22%)', opacity: 0, offset: .6}, {transform: 'translateY(-22%)', opacity: 0}], {direction: dir, easing: 'linear'}),
      A(n, [{transform: 'translateY(26%)', opacity: 0}, {transform: 'translateY(26%)', opacity: 0, offset: .45, easing: EOUT}, {transform: 'translateY(0)', opacity: 1}], {direction: dir, easing: 'linear'}),
      A(heat, [{opacity: 0, transform: 'translate(-50%,-40%) scale(.6)'}, {opacity: .95, transform: 'translate(-50%,-15%) scale(1)', offset: .4}, {opacity: 0, transform: 'translate(-50%,5%) scale(1.4)'}], {direction: dir})]; },
];
// nova missão (Retorno → Ignição) ou volta circular: troca suave
TX.wrap = (o, n) => { const f = ov('ov-fade');
  return [A(o, [{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: 'scale(.98)'}], {duration: 700}), A(f, [{opacity: 0}, {opacity: .8, offset: .5}, {opacity: 0}], {duration: 700}),
    A(n, [{opacity: 0, transform: 'scale(1.02)'}, {opacity: 0, transform: 'scale(1.02)', offset: .4, easing: EOUT}, {opacity: 1, transform: 'scale(1)'}], {duration: 700, easing: 'linear'})]; };
const TX_ENTER = [280, 220, 430, 260, 200, 380];

/* ============================ condução: capítulos, autoplay, teclado ============================ */
let cur = 0, playing = !reduce, elapsed = 0, last = performance.now(), busy = false;
function setPlaying(p){ playing = p; $('#play').textContent = p ? '❚❚' : '▶'; $('#play').setAttribute('aria-label', p ? 'Pausar' : 'Reproduzir'); }
async function go(i, dir){
  if(busy) return;
  i = (i + scenes.length) % scenes.length; if(i === cur) return;
  dir = dir || (i > cur ? 1 : -1);
  const from = cur, O = scenes[from], I = scenes[i];
  busy = true; document.body.classList.add('busy');
  if(LEAVE[from]) LEAVE[from](i, dir);
  cur = i; elapsed = 0; markChapters(); moveGlow(i);
  I.scrollTop = 0; I.classList.add('active', 'tr'); O.classList.add('tr');
  scenes.forEach((s, k) => { s.inert = k !== i; s.setAttribute('aria-hidden', k !== i); });
  let anims;
  if(reduce){
    anims = [A(O, [{opacity: 1}, {opacity: 0}], {duration: 260}), A(I, [{opacity: 0}, {opacity: 1}], {duration: 260})];
    shipTo(i); enterScene(i, dir);
  } else {
    const wrap = (dir === 1 && i === 0) || (dir === -1 && from === 0);
    warp(dir); shipTo(i);
    if(wrap) anims = TX.wrap(O, I);
    else if(dir === 1) anims = TX[i - 1](O, I, 'normal');
    else anims = TX[from - 1](I, O, 'reverse');
    setTimeout(() => enterScene(i, wrap ? 1 : dir), wrap ? 320 : dir === 1 ? TX_ENTER[i - 1] : 300);
  }
  await Promise.all(anims.map(a => a.finished.catch(() => {})));
  anims.forEach(a => a.cancel());
  O.classList.remove('active', 'tr'); I.classList.remove('tr'); O.style.zIndex = I.style.zIndex = '';
  tx.innerHTML = ''; $$('.scene.clone').forEach(c => c.remove());
  busy = false; document.body.classList.remove('busy');
}
chaps.forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
$('#play').addEventListener('click', () => setPlaying(!playing));
$('#prev').addEventListener('click', () => go(cur - 1, -1));
$('#next').addEventListener('click', () => go(cur + 1, 1));
addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input')) return;
  if(e.key === 'ArrowRight') go(cur + 1, 1); else if(e.key === 'ArrowLeft') go(cur - 1, -1);
  else if(e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
});
setPlaying(playing);
$('#gen').textContent = 'gerado ' + D.gerado;

/* ============================ tooltip ============================ */
const tip = $('#tip');
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if(!t){ tip.classList.remove('show'); return; }
  if(tip.textContent !== t.dataset.tip) tip.textContent = t.dataset.tip;
  tip.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,calc(-100% - 14px))`; tip.classList.add('show');
});

/* ============================ laço principal ============================ */
addEventListener('resize', () => { sizeStars(); moveGlow(cur); layoutFlow(); });
sizeStars();
const perf = {n: 0, t0: 0, done: reduce};
function loop(now){
  const dt = Math.min(64, now - last); last = now;
  if(!perf.done){ if(!perf.t0) perf.t0 = now; perf.n++;
    if(now - perf.t0 > 2500){ perf.done = true; if(perf.n * 1000 / (now - perf.t0) < 40){ document.body.classList.add('lite'); sizeStars(); } } }
  if(playing && !busy){
    elapsed += dt;
    if(cur === 2){ const d = Math.min(D.dias.length - 1, Math.floor(elapsed / DUR[2] * D.dias.length)); if(d !== day) setDay(d); }
    if(elapsed >= DUR[cur]) go(cur + 1, 1);
  }
  if(clk.state === 'flight') clk.ms += dt;
  drawClock();
  $('#mprog').style.transform = `scaleX(${((cur + Math.min(1, elapsed / DUR[cur])) / scenes.length).toFixed(4)})`;
  if(!reduce){
    drawStars(dt, now);
    if(SEQ.smoke) padSmoke('#pad1', SEQ.smoke === 2 ? 5 : 2, SEQ.smoke === 2);
    if(SEQ.trail) nozzleTrail('#rkBig .nz', 4);
    drawFx(dt);
    if(cur === 1 || busy) drawFlow(dt);
  }
  drawShip(now, dt);
  requestAnimationFrame(loop);
}
scenes.forEach((s, k) => { s.inert = k !== 0; s.setAttribute('aria-hidden', k !== 0); });
scenes[0].classList.add('active'); markChapters(); moveGlow(0); enterScene(0, 1);
if(reduce){ drawStars(0, performance.now()); requestAnimationFrame(() => { layoutFlow(); drawFlow(0); }); }
requestAnimationFrame(loop);
</script>
</body>
